# The hardening and probes every service's app shares, as a kustomize Component.
# It patches the Deployment named app, its container named app, which serves
# /healthz and /livez on the port named http:
#
#   components:
#     - https://github.com/Sustenaut/pubkit//k8s/components/app?ref=<commit> # vX.Y.Z
#
# The pod runs as user 1000, not root, under the runtime's seccomp profile, with no
# API token; the container can't gain privileges, has no capabilities, and can't
# write its root filesystem, so whatever it writes goes to a volume it mounts.
# Kubernetes waits for /healthz to start, restarts the container when /livez
# stops answering, and sends it requests only while /healthz answers. An app that
# needs its token patches automountServiceAccountToken back to true in its own
# kustomization: a kustomization's own patches come after its components'.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - path: app.yaml
    target:
      kind: Deployment
      name: app
