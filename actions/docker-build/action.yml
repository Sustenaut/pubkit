# Builds a Docker image with its layers cached in GitHub Actions, so a stage
# nothing changed (a compiled tool pinned by commit, an install from a lock)
# is restored instead of built again. The image is loaded into the runner's
# Docker for the job's own checks and `docker push`.
#
#   - uses: Sustenaut/pubkit/actions/docker-build@vX.Y.Z
#     with:
#       tags: ${{ env.IMAGE }}:${{ github.sha }}
#       scope: pub-site
#
# Give each image its own scope: images sharing one overwrite each other's
# cache. A failure of the cache service only makes the build slower.
#
# A cached layer stays as it was built, so `apt-get install` in an unchanged
# stage keeps its packages until something before it changes. Run with
# no-cache (from a workflow_dispatch input, say) to take the current ones.
name: docker-build
description: Build a Docker image with buildx and a GitHub Actions layer cache, loaded into the runner's Docker.

inputs:
  tags:
    description: The image's tags, one per line.
    required: true
  scope:
    description: The cache's name, one per image.
    required: true
  context:
    description: The build's context directory.
    default: .
  file:
    description: The Dockerfile, when it is not <context>/Dockerfile.
    default: ''
  build-args:
    description: Build arguments, one NAME=value per line.
    default: ''
  no-cache:
    description: Build every layer again; the result still fills the cache.
    default: 'false'

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      env:
        DOCKER_BUILD_SUMMARY: 'false'
        DOCKER_BUILD_RECORD_UPLOAD: 'false'
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        tags: ${{ inputs.tags }}
        build-args: ${{ inputs.build-args }}
        no-cache: ${{ inputs.no-cache }}
        load: true
        provenance: false
        cache-from: type=gha,scope=${{ inputs.scope }}
        cache-to: type=gha,scope=${{ inputs.scope }},mode=max,ignore-error=true
