# Keeps what a build fetched or made between runs, by the entries of the
# repository's pubkit.json `cache` block (README, "Caching a build"). Each
# entry gets a key of its own: a fetched entry (refresh: day, week, month
# or never) is kept for its period; a made entry (inputs or unit) is
# restored from the latest run, and the build makes it through
# `pubkit cache run`. Call it twice:
#
#   - uses: Sustenaut/pubkit/actions/cache@vX.Y.Z
#     with: { step: restore, fresh: "${{ inputs.fresh || false }}" }
#
# refresh: 'true' on restore restores nothing at all, as when the pull
# request a run is for carries the "refresh cache" label (actions/pr-label).
#   - run: bin/build              # uses `pubkit cache run` for what it makes
#   - uses: Sustenaut/pubkit/actions/cache@vX.Y.Z
#     with: { step: save }
#
# save first drops what no run used (pubkit cache prune), then keeps each
# entry under its key. A cache block holds at most eight entries.
name: cache
description: Restore or save a build's cache entries by the cache block in pubkit.json.

inputs:
  step:
    description: "'restore' before the build, 'save' after it."
    required: true
  fresh:
    description: "With step restore: 'true' restores no fetched entry, so each is fetched anew."
    default: 'false'
  refresh:
    description: "With step restore: 'true' restores no entry, fetched or made, so the build fetches and makes everything anew (see actions/pr-label)."
    default: 'false'

runs:
  using: composite
  steps:
    - name: Plan the cache keys
      id: plan
      shell: bash
      env:
        STEP: ${{ inputs.step }}
        FRESH: ${{ inputs.fresh }}
        REFRESH: ${{ inputs.refresh }}
      run: '"$GITHUB_ACTION_PATH/plan.sh"'

    - name: Restore cache entry 1
      if: inputs.step == 'restore' && steps.plan.outputs.restore-1 == 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.plan.outputs.path-1 }}
        key: ${{ steps.plan.outputs.key-1 }}
        restore-keys: ${{ steps.plan.outputs.prefix-1 }}

    - name: Restore cache entry 2
      if: inputs.step == 'restore' && steps.plan.outputs.restore-2 == 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.plan.outputs.path-2 }}
        key: ${{ steps.plan.outputs.key-2 }}
        restore-keys: ${{ steps.plan.outputs.prefix-2 }}

    - name: Restore cache entry 3
      if: inputs.step == 'restore' && steps.plan.outputs.restore-3 == 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.plan.outputs.path-3 }}
        key: ${{ steps.plan.outputs.key-3 }}
        restore-keys: ${{ steps.plan.outputs.prefix-3 }}

    - name: Restore cache entry 4
      if: inputs.step == 'restore' && steps.plan.outputs.restore-4 == 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.plan.outputs.path-4 }}
        key: ${{ steps.plan.outputs.key-4 }}
        restore-keys: ${{ steps.plan.outputs.prefix-4 }}

    - name: Restore cache entry 5
      if: inputs.step == 'restore' && steps.plan.outputs.restore-5 == 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.plan.outputs.path-5 }}
        key: ${{ steps.plan.outputs.key-5 }}
        restore-keys: ${{ steps.plan.outputs.prefix-5 }}

    - name: Restore cache entry 6
      if: inputs.step == 'restore' && steps.plan.outputs.restore-6 == 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.plan.outputs.path-6 }}
        key: ${{ steps.plan.outputs.key-6 }}
        restore-keys: ${{ steps.plan.outputs.prefix-6 }}

    - name: Restore cache entry 7
      if: inputs.step == 'restore' && steps.plan.outputs.restore-7 == 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.plan.outputs.path-7 }}
        key: ${{ steps.plan.outputs.key-7 }}
        restore-keys: ${{ steps.plan.outputs.prefix-7 }}

    - name: Restore cache entry 8
      if: inputs.step == 'restore' && steps.plan.outputs.restore-8 == 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.plan.outputs.path-8 }}
        key: ${{ steps.plan.outputs.key-8 }}
        restore-keys: ${{ steps.plan.outputs.prefix-8 }}

    - name: Drop what no run used
      if: inputs.step == 'save'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/prune.sh"'

    # A fetched entry's key that exists is kept as it is: this period's
    # copy is saved once, by the first run that fetched it.
    - name: Save cache entry 1
      if: inputs.step == 'save' && steps.plan.outputs.key-1 != ''
      continue-on-error: true
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.plan.outputs.path-1 }}
        key: ${{ steps.plan.outputs.key-1 }}

    # A fetched entry's key that exists is kept as it is: this period's
    # copy is saved once, by the first run that fetched it.
    - name: Save cache entry 2
      if: inputs.step == 'save' && steps.plan.outputs.key-2 != ''
      continue-on-error: true
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.plan.outputs.path-2 }}
        key: ${{ steps.plan.outputs.key-2 }}

    # A fetched entry's key that exists is kept as it is: this period's
    # copy is saved once, by the first run that fetched it.
    - name: Save cache entry 3
      if: inputs.step == 'save' && steps.plan.outputs.key-3 != ''
      continue-on-error: true
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.plan.outputs.path-3 }}
        key: ${{ steps.plan.outputs.key-3 }}

    # A fetched entry's key that exists is kept as it is: this period's
    # copy is saved once, by the first run that fetched it.
    - name: Save cache entry 4
      if: inputs.step == 'save' && steps.plan.outputs.key-4 != ''
      continue-on-error: true
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.plan.outputs.path-4 }}
        key: ${{ steps.plan.outputs.key-4 }}

    # A fetched entry's key that exists is kept as it is: this period's
    # copy is saved once, by the first run that fetched it.
    - name: Save cache entry 5
      if: inputs.step == 'save' && steps.plan.outputs.key-5 != ''
      continue-on-error: true
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.plan.outputs.path-5 }}
        key: ${{ steps.plan.outputs.key-5 }}

    # A fetched entry's key that exists is kept as it is: this period's
    # copy is saved once, by the first run that fetched it.
    - name: Save cache entry 6
      if: inputs.step == 'save' && steps.plan.outputs.key-6 != ''
      continue-on-error: true
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.plan.outputs.path-6 }}
        key: ${{ steps.plan.outputs.key-6 }}

    # A fetched entry's key that exists is kept as it is: this period's
    # copy is saved once, by the first run that fetched it.
    - name: Save cache entry 7
      if: inputs.step == 'save' && steps.plan.outputs.key-7 != ''
      continue-on-error: true
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.plan.outputs.path-7 }}
        key: ${{ steps.plan.outputs.key-7 }}

    # A fetched entry's key that exists is kept as it is: this period's
    # copy is saved once, by the first run that fetched it.
    - name: Save cache entry 8
      if: inputs.step == 'save' && steps.plan.outputs.key-8 != ''
      continue-on-error: true
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.plan.outputs.path-8 }}
        key: ${{ steps.plan.outputs.key-8 }}
