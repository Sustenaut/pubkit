# Reusable CI for a Node package:
#
#   ci:
#     uses: schryer/pubkit/.github/workflows/node-ci.yml@vX.Y.Z
#     with: { browser-test: npm run test:browser }
#     secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }
#
# Dependencies install from package-lock.json without running their install
# scripts, and npx runs only what that installed, so a compromised package
# cannot run code just by being installed. The commands are inputs; the
# defaults are npm's own.
#
# fast-check property tests try PUBKIT_FUZZ_RUNS inputs each, given a setup
# file the test command loads that calls
#   fc.configureGlobal({ numRuns: Number(process.env.PUBKIT_FUZZ_RUNS) || 100 })
# fuzz-runs on every push and pull request, fuzz-runs-scheduled on a
# schedule (security.fuzz.node in pubkit.json).
#
# The audit job checks every locked package, development ones included,
# against npm's advisories on every run, nightly included, and fails on any
# finding. It has no switch.
name: node-ci

on:
  workflow_call:
    inputs:
      node-version: { type: string, default: '22' }
      python-version: { type: string, default: '3.14', description: For pubkit sync --check. }
      apt-packages: { type: string, default: '', description: Extra Ubuntu packages to install first. }
      setup: { type: string, default: npm ci --ignore-scripts --no-audit --no-fund, description: Installs the locked dependencies. }
      test: { type: string, default: npm test, description: Runs the tests. }
      browser-test: { type: string, default: '', description: Runs the browser tests too; empty skips the browser job. }
      browser-setup: { type: string, default: npx --no-install playwright install --with-deps chromium }
      browser-coverage-report: { type: string, default: coverage/, description: "The coverage the browser test command writes, if any, which the sonar job reads with the test job's report." }
      sync-check: { type: boolean, default: true, description: "Fail if pubkit's managed files drifted, using the pubkit tests/requirements.lock pins." }
      sonar-args: { type: string, default: '', description: "Extra SonarQube Cloud properties for the sonar job, such as -Dsonar.exclusions=vendor/**." }
      coverage-report: { type: string, default: coverage/lcov.info, description: "The LCOV report the test command writes, if any, which the sonar job reads: node --test --experimental-test-coverage --test-reporter=lcov --test-reporter-destination=coverage/lcov.info writes one." }
      fuzz-runs: { type: string, default: '100', description: "Inputs each property test tries (PUBKIT_FUZZ_RUNS)." }
      fuzz-runs-scheduled: { type: string, default: '10000', description: "Inputs each property test tries on a scheduled run." }
    secrets:
      SONAR_TOKEN: { required: false, description: "A SonarQube Cloud token: with it, the sonar job analyses the code. Pass it by name: secrets: inherit does not reach a workflow of another owner." }

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '${{ inputs.node-version }}' }
      - if: inputs.sync-check
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '${{ inputs.python-version }}' }
      - if: inputs.sync-check
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --require-hashes -r tests/requirements.lock
          .venv/bin/pubkit sync --check
      - if: inputs.apt-packages != ''
        run: sudo apt-get update && sudo apt-get install -y $APT
        env: { APT: '${{ inputs.apt-packages }}' }
      - run: ${{ inputs.setup }}
      # Each property test (Hypothesis, fast-check) tries PUBKIT_FUZZ_RUNS
      # inputs. A scheduled run tries more, unless pubkit.json sets
      # "security": { "fuzz": { "node": false } }.
      - run: |
          runs=$SHORT
          if [ "$EVENT" = schedule ] && [ "$(jq '.security.fuzz | (if type == "object" then .node else . end) != false' pubkit.json 2>/dev/null || echo true)" = true ]; then
            runs=$LONG
          fi
          echo "PUBKIT_FUZZ_RUNS=$runs" >> "$GITHUB_ENV"
        env:
          EVENT: '${{ github.event_name }}'
          SHORT: '${{ inputs.fuzz-runs }}'
          LONG: '${{ inputs.fuzz-runs-scheduled }}'
      - run: ${{ inputs.test }}
      # The sonar job runs elsewhere, so the report goes to it as an artifact.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: ${{ inputs.coverage-report }}
          if-no-files-found: ignore
          retention-days: 1

  browser:
    if: inputs.browser-test != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '${{ inputs.node-version }}' }
      - if: inputs.apt-packages != ''
        run: sudo apt-get update && sudo apt-get install -y $APT
        env: { APT: '${{ inputs.apt-packages }}' }
      - run: ${{ inputs.setup }}
      - run: ${{ inputs.browser-setup }}
      - run: ${{ inputs.browser-test }}
      # Its coverage joins the test job's, as an artifact of its own.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-browser
          path: ${{ inputs.browser-coverage-report }}
          if-no-files-found: ignore
          retention-days: 1

  # Every package in package-lock.json against npm's advisory database,
  # without installing anything.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '${{ inputs.node-version }}' }
      - run: npm audit --package-lock-only --audit-level=low

  # Every lockfile the repository commits (Cargo.lock, package-lock.json,
  # the hash-locked pip requirements) against the OSV database, which
  # gathers the RustSec, GitHub, PyPI and npm advisories, on every run. It
  # has no switch. The lockfiles are named rather than found by a recursive
  # scan, which would read a requirements.txt's lower bounds as pins.
  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: locks
        run: |
          {
            echo 'args<<EOF'
            git ls-files '*Cargo.lock' '*package-lock.json' \
              | sed 's/^/--lockfile=/'
            git ls-files '*requirements.lock' | sed 's/^/--lockfile=requirements.txt:/'
            echo EOF
          } >> "$GITHUB_OUTPUT"
          git ls-files '*Cargo.lock' '*package-lock.json' '*requirements.lock' | grep -q . \
            && echo "found=true" >> "$GITHUB_OUTPUT" \
            || echo "::notice::No lockfile is committed, so OSV-Scanner has nothing to scan."
      - if: steps.locks.outputs.found == 'true'
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: ${{ steps.locks.outputs.args }}

  # A pull request that adds or moves a dependency to a version with a
  # known vulnerability fails here, before it merges. GitHub's dependency
  # graph serves it for public repositories only.
  review:
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # SonarQube Cloud's analysis, into the project OWNER_REPO of the
  # organization OWNER, when the caller passes a SONAR_TOKEN. Without one, as
  # in a private repository or a pull request from a fork, it says so and
  # passes. The full history lets it tell new code from old, and the
  # coverage reports the test and browser jobs wrote, if any, give the
  # coverage SonarQube Cloud's quality gate asks of new code. Each report
  # arrives in coverage-download/<artifact>/.
  sonar:
    needs: [test, browser]
    # It waits for the browser job too, so the browser tests' coverage
    # counts; when no browser-test was asked for, that job is skipped.
    if: always() && needs.test.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.browser.result)
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - if: env.SONAR_TOKEN == ''
        # A pull request from a fork gets no secrets, by design: a notice.
        # Anything else got none because the caller passed none: a warning
        # naming the usual cause, since the job still passes.
        run: |
          if [ "$FORK" = true ]; then
            echo "::notice::No SONAR_TOKEN was passed, so SonarQube Cloud did not analyse this commit."
          else
            echo "::warning::No SONAR_TOKEN reached the sonar job, so SonarQube Cloud did not analyse this commit. Either the repository (or its organization) has no SONAR_TOKEN secret, or the caller passes it with secrets: inherit to a workflow of another owner, which GitHub drops; pass SONAR_TOKEN by name under the job's secrets."
          fi
        env: { FORK: '${{ github.event.pull_request.head.repo.fork || false }}' }
      - if: env.SONAR_TOKEN != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { fetch-depth: 0 }
      - if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: coverage*
          path: coverage-download
      # The reports keep the file names the test commands gave them.
      - if: env.SONAR_TOKEN != ''
        id: report
        run: echo "paths=$(find coverage-download -type f 2>/dev/null | paste -sd, -)" >> "$GITHUB_OUTPUT"
      # Properties pubkit.json adds (security.sonar.args), after the input's.
      - if: env.SONAR_TOKEN != ''
        id: settings
        # The organization: security.sonar.organization, or the owner in
        # lower case, since SonarQube Cloud's organization keys are.
        run: |
          echo "args=$(jq -r '.security.sonar.args // ""' pubkit.json 2>/dev/null)" >> "$GITHUB_OUTPUT"
          organization=$(jq -r '.security.sonar.organization // ""' pubkit.json 2>/dev/null || true)
          echo "organization=${organization:-${OWNER,,}}" >> "$GITHUB_OUTPUT"
        env: { OWNER: '${{ github.repository_owner }}' }
      - if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        with:
          args: >-
            -Dsonar.organization=${{ steps.settings.outputs.organization }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            -Dsonar.javascript.lcov.reportPaths=${{ steps.report.outputs.paths }}
            ${{ inputs.sonar-args }}
            ${{ steps.settings.outputs.args }}

  # The one check a ruleset requires. A skipped job counts as passing a
  # required check, so this job always runs and passes only if every job it
  # needs succeeded -- the browser job may be skipped only when no
  # browser-test was asked for, and the review job off a public pull
  # request.
  passed:
    if: always()
    needs: [test, browser, audit, osv, review, sonar]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e --arg browser "$BROWSER" '
            all(to_entries[];
                .value.result == "success"
                or (.key == "browser" and $browser == "" and .value.result == "skipped")
                or (.key == "review" and .value.result == "skipped"))' > /dev/null
        env:
          RESULTS: '${{ toJSON(needs) }}'
          BROWSER: '${{ inputs.browser-test }}'
