# Reusable CI for a Node package:
#
#   ci:
#     uses: schryer/pubkit/.github/workflows/node-ci.yml@vX.Y.Z
#     with: { browser-test: npm run test:browser }
#     secrets: inherit
#
# Dependencies install from package-lock.json without running their install
# scripts, and npx runs only what that installed, so a compromised package
# cannot run code just by being installed. The commands are inputs; the
# defaults are npm's own.
name: node-ci

on:
  workflow_call:
    inputs:
      node-version: { type: string, default: '22' }
      python-version: { type: string, default: '3.14', description: For pubkit sync --check. }
      apt-packages: { type: string, default: '', description: Extra Ubuntu packages to install first. }
      setup: { type: string, default: npm ci --ignore-scripts --no-audit --no-fund, description: Installs the locked dependencies. }
      test: { type: string, default: npm test, description: Runs the tests. }
      browser-test: { type: string, default: '', description: Runs the browser tests too; empty skips the browser job. }
      browser-setup: { type: string, default: npx --no-install playwright install --with-deps chromium }
      sync-check: { type: boolean, default: true, description: "Fail if pubkit's managed files drifted, using the pubkit tests/requirements.lock pins." }
      sonar-args: { type: string, default: '', description: "Extra SonarQube Cloud properties for the sonar job, such as -Dsonar.exclusions=vendor/**." }
    secrets:
      SONAR_TOKEN: { required: false, description: "A SonarQube Cloud token: with it, the sonar job analyses the code. Pass it with secrets: inherit." }

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '${{ inputs.node-version }}' }
      - if: inputs.sync-check
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '${{ inputs.python-version }}' }
      - if: inputs.sync-check
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --require-hashes -r tests/requirements.lock
          .venv/bin/pubkit sync --check
      - if: inputs.apt-packages != ''
        run: sudo apt-get update && sudo apt-get install -y $APT
        env: { APT: '${{ inputs.apt-packages }}' }
      - run: ${{ inputs.setup }}
      - run: ${{ inputs.test }}

  browser:
    if: inputs.browser-test != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '${{ inputs.node-version }}' }
      - if: inputs.apt-packages != ''
        run: sudo apt-get update && sudo apt-get install -y $APT
        env: { APT: '${{ inputs.apt-packages }}' }
      - run: ${{ inputs.setup }}
      - run: ${{ inputs.browser-setup }}
      - run: ${{ inputs.browser-test }}

  # SonarQube Cloud's analysis, into the project OWNER_REPO of the
  # organization OWNER, when the caller passes a SONAR_TOKEN. Without one, as
  # in a private repository or a pull request from a fork, it says so and
  # passes. The full history lets it tell new code from old.
  sonar:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - if: env.SONAR_TOKEN == ''
        run: echo "::notice::No SONAR_TOKEN was passed, so SonarQube Cloud did not analyse this commit."
      - if: env.SONAR_TOKEN != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { fetch-depth: 0 }
      - if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        with:
          args: >-
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            ${{ inputs.sonar-args }}

  # The one check a ruleset requires. A skipped job counts as passing a
  # required check, so this job always runs and passes only if every job it
  # needs succeeded -- the browser job may be skipped only when no
  # browser-test was asked for.
  passed:
    if: always()
    needs: [test, browser, sonar]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e --arg browser "$BROWSER" '
            all(to_entries[];
                .value.result == "success"
                or (.key == "browser" and $browser == "" and .value.result == "skipped"))' > /dev/null
        env:
          RESULTS: '${{ toJSON(needs) }}'
          BROWSER: '${{ inputs.browser-test }}'
