# Reusable CI for a Rust package whose behaviour a Gherkin suite tests:
#
#   ci:
#     uses: Sustenaut/pubkit/.github/workflows/rust-ci.yml@vX.Y.Z
#     with:
#       tools: '[{"crate": "some-cli", "git": "https://github.com/example-org/some-cli", "tag": "v1.2.3"}]'
#     secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }
#
# Every check the Rust crate standard tags `[checked: ..., make TARGET]` runs
# here, for every repository: the plan job asks `pubkit required` (from the
# pubkit the repository's lock pins) which targets each job must run, and
# the jobs run them. The `gates` and `functional` inputs add a repository's
# own targets (guards, conformance) after the required ones; they cannot
# drop one. The cross-platform job runs cargo directly: macOS ships make
# 3.81, and Windows has no /bin/bash.
#
# Jobs the standard requires, beyond gates, test and functional, each run
# unless the repository declares an exception for its rule in pubkit.json.
# fuzz and cross are also skipped on a pull request that touches no Rust
# code, Cargo files, fuzz/ or workflow files; a release pull request, a push
# and the nightly run them always:
#
# - msrv builds on the oldest Rust the packages promise, the lowest
#   `rust-version` their manifests state, by `make msrv MSRV=<version>`.
# - fuzz runs `make fuzz-smoke FUZZ_SECONDS=<n>` on nightly Rust: briefly on
#   every change, longer on a schedule unless pubkit.json sets
#   `"security": { "fuzz": { "rust": false } }`.
# - cross runs the tests under emulation on cross-targets: i686 (32-bit) and
#   s390x (big-endian) by default, which find word-size and byte-order bugs.
# - audit runs `make deny` and `make vet`.
#
# The sonar job sends the code to SonarQube Cloud when the caller passes a
# SONAR_TOKEN (by name: `secrets: inherit` reaches no workflow of
# another owner), and otherwise passes with a notice. With
# a token, the functional job runs `make coverage` in place of `make
# functional`: the same suite, and the Rust tests, on a build cargo-llvm-cov
# instruments, whose report the sonar job sends along.
#
# When the caller's workflow also runs on a `schedule`, those runs add the
# toolchains job: the tests on the latest stable and beta Rust, which the
# pinned toolchain cannot show breaking.
name: rust-ci

on:
  workflow_call:
    inputs:
      python-version: { type: string, default: '3.14' }
      apt-packages: { type: string, default: '', description: Extra Ubuntu packages for the functional job. }
      pub-version: { type: string, default: '', description: 'Deprecated: use tools. A publet tag whose pub the functional suite drives; empty installs none.' }
      tools: { type: string, default: '', description: 'JSON list of the tools the functional suite drives, each {"crate", "git", "tag"}, which pubkit sync gives from ci.tools; empty installs none.' }
      os-matrix: { type: string, default: '["ubuntu-latest", "macos-latest", "windows-latest"]' }
      gates: { type: string, default: '', description: "Extra make targets the gates job runs after the required ones." }
      test-args: { type: string, default: '', description: Arguments to cargo test on every platform. }
      functional: { type: string, default: '', description: "Extra make targets the functional job runs after the required ones." }
      msrv: { type: boolean, default: true, description: "Ignored: the msrv job runs whenever the standard requires it (RS-VER-02). Kept so callers that pass it keep working." }
      fuzz: { type: boolean, default: true, description: "Ignored: the fuzz job runs whenever the standard requires it (RS-FUZZ-01, RS-FUZZ-02). Kept so callers that pass it keep working." }
      fuzz-seconds: { type: number, default: 60, description: Seconds per fuzz target on a pull request or push. }
      fuzz-seconds-scheduled: { type: number, default: 900, description: 'Seconds per fuzz target on a scheduled run, unless pubkit.json sets "security": { "fuzz": { "rust": false } }.' }
      cargo-fuzz-version: { type: string, default: 0.13.2 }
      cross-targets: { type: string, default: '["i686-unknown-linux-gnu", "s390x-unknown-linux-gnu"]', description: "JSON list of targets to test under emulation: i686-unknown-linux-gnu, s390x-unknown-linux-gnu, aarch64-unknown-linux-gnu. The standard asks for a 32-bit and a big-endian one (RS-PLAT-01)." }
      cross-test-args: { type: string, default: '', description: "Arguments to cargo test on each cross target, such as -p for the crates that matter." }
      cargo-deny-version: { type: string, default: 0.20.2 }
      cargo-vet-version: { type: string, default: 0.10.2 }
      cargo-llvm-cov-version: { type: string, default: 0.9.1, description: "The cargo-llvm-cov the functional job measures coverage with, when there is a SONAR_TOKEN." }
      scheduled-toolchains: { type: string, default: '["stable", "beta"]', description: JSON list of toolchains a scheduled run tests on. }
      sonar-args: { type: string, default: '', description: "Extra SonarQube Cloud properties for the sonar job, such as -Dsonar.exclusions=vendor/**." }
    secrets:
      SONAR_TOKEN: { required: false, description: "A SonarQube Cloud token: with it, the sonar job analyses the code. Pass it by name: secrets: inherit does not reach a workflow of another owner." }

env:
  CARGO_TERM_COLOR: always

jobs:
  # What the standard requires here: the managed files in step, then the
  # make targets each job must run, from `pubkit required`.
  plan:
    runs-on: ubuntu-latest
    outputs:
      gates: ${{ steps.required.outputs.gates }}
      functional: ${{ steps.required.outputs.functional }}
      msrv: ${{ steps.required.outputs.msrv }}
      fuzz: ${{ steps.required.outputs.fuzz }}
      audit: ${{ steps.required.outputs.audit }}
      cross_job: ${{ steps.required.outputs.cross_job }}
    steps:
      # Two commits, so a pull request's merge commit can be compared with
      # its base: a pull request that touches no Rust code, Cargo files,
      # fuzz/ or workflow files skips fuzz and cross. Release pull requests,
      # pushes and scheduled runs run everything.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '${{ inputs.python-version }}' }
      - run: make venv
      - run: make sync-check
      - if: github.event_name == 'pull_request'
        run: git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed-files"
      - id: required
        run: |
          changed=()
          if [ -f "$RUNNER_TEMP/changed-files" ]; then changed=(--changed-files "$RUNNER_TEMP/changed-files"); fi
          .venv/bin/pubkit required --github-output --event "$EVENT" --head-ref "$HEAD_REF" "${changed[@]}"
        env: { EVENT: '${{ github.event_name }}', HEAD_REF: '${{ github.head_ref }}' }

  gates:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '${{ inputs.python-version }}' }
      - run: cargo --version && rustc --version
      - run: make venv
      - run: |
          for target in $(printf '%s\n' $REQUIRED $EXTRA | awk 'NF && !seen[$0]++'); do
            echo "::group::make $target"; make "$target"; echo "::endgroup::"
          done
        env: { REQUIRED: '${{ needs.plan.outputs.gates }}', EXTRA: '${{ inputs.gates }}' }

  test:
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os-matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: cargo test ${{ inputs.test-args }}

  functional:
    needs: [plan, gates]
    runs-on: ubuntu-latest
    env:
      # Measure coverage only when there is a scan to send it to; the token
      # itself stays out of this job.
      COVERAGE: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '${{ inputs.python-version }}' }
      - if: inputs.apt-packages != ''
        run: sudo apt-get update && sudo apt-get install -y $APT
        env: { APT: '${{ inputs.apt-packages }}' }
      - if: inputs.pub-version != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/pub
          key: pub-${{ inputs.pub-version }}
      - if: inputs.pub-version != ''
        run: |
          command -v pub >/dev/null && pub --version | grep -q "^pub ${PUB#v}$" \
            || cargo install --locked --git https://github.com/Sustenaut/publet --tag "$PUB" publet-cli
        env: { PUB: '${{ inputs.pub-version }}' }
      - if: inputs.tools != ''
        id: tools
        run: |
          echo "key=$(printf %s "$TOOLS" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "$HOME/.cargo-tools/bin" >> "$GITHUB_PATH"
        env: { TOOLS: '${{ inputs.tools }}' }
      - if: inputs.tools != ''
        id: tools-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo-tools
          key: tools-${{ steps.tools.outputs.key }}-${{ runner.os }}
      - if: inputs.tools != '' && steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          jq -r '.[] | [.crate, .git, .tag] | @tsv' <<<"$TOOLS" | while IFS=$'\t' read -r crate git tag; do
            cargo install --locked --root "$HOME/.cargo-tools" --git "$git" --tag "$tag" "$crate"
          done
        env: { TOOLS: '${{ inputs.tools }}' }
      - if: env.COVERAGE == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-${{ inputs.cargo-llvm-cov-version }}-${{ runner.os }}
      - if: env.COVERAGE == 'true'
        run: |
          rustup component add llvm-tools-preview
          command -v cargo-llvm-cov >/dev/null && cargo llvm-cov --version | grep -q " ${VERSION}$" \
            || cargo install --locked cargo-llvm-cov --version "$VERSION"
        env: { VERSION: '${{ inputs.cargo-llvm-cov-version }}' }
      - run: make venv
      - run: |
          for target in $(printf '%s\n' $REQUIRED $EXTRA | awk 'NF && !seen[$0]++'); do
            if [[ "$target" = functional && "$COVERAGE" = true ]]; then target=coverage; fi
            echo "::group::make $target"; make "$target"; echo "::endgroup::"
          done
        env: { REQUIRED: '${{ needs.plan.outputs.functional }}', EXTRA: '${{ inputs.functional }}' }
      # The sonar job runs elsewhere, so the reports go to it as an artifact:
      # the LCOV of `make coverage`, and any Cobertura XML a functional target
      # wrote in coverage/, such as the coverage of a repository's Python.
      - if: env.COVERAGE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: |
            coverage/lcov.info
            coverage/*.xml
          if-no-files-found: ignore
          retention-days: 1

  msrv:
    if: needs.plan.outputs.msrv != ''
    needs: [plan, gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The oldest rust-version any package states: the oldest Rust the
      # repository promises anything on. Its `make msrv` builds whichever
      # packages make that promise.
      - name: Find the oldest promised Rust
        id: msrv
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].rust_version // empty' | sort -V | head -1)
          if [ -z "$version" ]; then
            echo "::error::msrv is on, but no package states a rust-version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install "$MSRV" --profile minimal
        env: { MSRV: '${{ steps.msrv.outputs.version }}' }
      - run: make msrv MSRV="$MSRV"
        env: { MSRV: '${{ steps.msrv.outputs.version }}' }

  fuzz:
    if: needs.plan.outputs.fuzz != ''
    needs: [plan, gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: rustup toolchain install nightly --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ inputs.cargo-fuzz-version }}-${{ runner.os }}
      - run: |
          command -v cargo-fuzz >/dev/null && cargo-fuzz --version | grep -q " ${VERSION}$" \
            || cargo install --locked cargo-fuzz --version "$VERSION"
        env: { VERSION: '${{ inputs.cargo-fuzz-version }}' }
      # A scheduled run fuzzes for longer, unless pubkit.json sets
      # "security": { "fuzz": { "rust": false } }; then it fuzzes as briefly
      # as any other.
      - run: |
          seconds=$SHORT
          if [ "$EVENT" = schedule ] && [ "$(jq '.security.fuzz | (if type == "object" then .rust else . end) != false' pubkit.json 2>/dev/null || echo true)" = true ]; then
            seconds=$LONG
          fi
          make fuzz-smoke FUZZ_SECONDS="$seconds"
        env:
          EVENT: '${{ github.event_name }}'
          SHORT: '${{ inputs.fuzz-seconds }}'
          LONG: '${{ inputs.fuzz-seconds-scheduled }}'

  # Built for the target with its own gcc, run under qemu-user. Doctests
  # are not cross-compiled on stable Rust, so these run the unit and
  # integration tests.
  cross:
    if: needs.plan.outputs.cross_job == 'true' && inputs.cross-targets != '[]'
    needs: [plan, gates]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.cross-targets) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install the target's linker and emulator
        run: |
          case "$TARGET" in
            i686-unknown-linux-gnu)
              sudo apt-get update && sudo apt-get install -y gcc-multilib ;;
            s390x-unknown-linux-gnu)
              sudo apt-get update && sudo apt-get install -y gcc-s390x-linux-gnu libc6-dev-s390x-cross qemu-user
              echo "CARGO_TARGET_S390X_UNKNOWN_LINUX_GNU_LINKER=s390x-linux-gnu-gcc" >> "$GITHUB_ENV"
              echo "CARGO_TARGET_S390X_UNKNOWN_LINUX_GNU_RUNNER=qemu-s390x -L /usr/s390x-linux-gnu" >> "$GITHUB_ENV" ;;
            aarch64-unknown-linux-gnu)
              sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER=qemu-aarch64 -L /usr/aarch64-linux-gnu" >> "$GITHUB_ENV" ;;
            *) echo "::error::no recipe for $TARGET (i686, s390x and aarch64 linux-gnu are known)"; exit 1 ;;
          esac
        env: { TARGET: '${{ matrix.target }}' }
      - run: rustup target add "$TARGET"
        env: { TARGET: '${{ matrix.target }}' }
      - run: cargo test --target "$TARGET" $ARGS
        env: { TARGET: '${{ matrix.target }}', ARGS: '${{ inputs.cross-test-args }}' }

  # Advisories, licences, bans and sources (cargo deny), and every
  # dependency audited, trusted or exempt with its evidence (cargo vet).
  audit:
    if: needs.plan.outputs.audit != ''
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-vet
          key: audit-tools-${{ inputs.cargo-deny-version }}-${{ inputs.cargo-vet-version }}-${{ runner.os }}
      - run: |
          command -v cargo-deny >/dev/null && cargo deny --version | grep -q " ${DENY}$" \
            || cargo install --locked cargo-deny --version "$DENY"
          command -v cargo-vet >/dev/null && cargo vet --version | grep -q " ${VET}$" \
            || cargo install --locked cargo-vet --version "$VET"
        env: { DENY: '${{ inputs.cargo-deny-version }}', VET: '${{ inputs.cargo-vet-version }}' }
      - run: |
          for target in $REQUIRED; do
            echo "::group::make $target"; make "$target"; echo "::endgroup::"
          done
        env: { REQUIRED: '${{ needs.plan.outputs.audit }}' }

  # Scheduled runs only: the tests on Rust newer than the pinned toolchain,
  # so a release that breaks the build is seen the day it ships rather than
  # when the pin moves. Not run on pull requests, where a new Rust's
  # breakage is not the change's fault.
  toolchains:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        toolchain: ${{ fromJSON(inputs.scheduled-toolchains) }}
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - run: cargo --version && cargo test ${{ inputs.test-args }}

  # Every lockfile the repository commits (Cargo.lock, package-lock.json,
  # the hash-locked pip requirements) against the OSV database, which
  # gathers the RustSec, GitHub, PyPI and npm advisories, on every run. It
  # has no switch. The lockfiles are named rather than found by a recursive
  # scan, which would read a requirements.txt's lower bounds as pins.
  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: locks
        run: |
          {
            echo 'args<<EOF'
            git ls-files '*Cargo.lock' '*package-lock.json' \
              | sed 's/^/--lockfile=/'
            git ls-files '*requirements.lock' | sed 's/^/--lockfile=requirements.txt:/'
            echo EOF
          } >> "$GITHUB_OUTPUT"
          git ls-files '*Cargo.lock' '*package-lock.json' '*requirements.lock' | grep -q . \
            && echo "found=true" >> "$GITHUB_OUTPUT" \
            || echo "::notice::No lockfile is committed, so OSV-Scanner has nothing to scan."
      - if: steps.locks.outputs.found == 'true'
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: ${{ steps.locks.outputs.args }}

  # A pull request that adds or moves a dependency to a version with a
  # known vulnerability fails here, before it merges. GitHub's dependency
  # graph serves it for public repositories only.
  review:
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # SonarQube Cloud's analysis, into the project OWNER_REPO of the
  # organization OWNER, when the caller passes a SONAR_TOKEN. Without one, as
  # in a private repository or a pull request from a fork, it says so and
  # passes. The full history lets it tell new code from old, and the
  # functional job's coverage report gives the coverage SonarQube Cloud's
  # quality gate asks of new code.
  sonar:
    needs: functional
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - if: env.SONAR_TOKEN == ''
        # A pull request from a fork gets no secrets, by design: a notice.
        # Anything else got none because the caller passed none: a warning
        # naming the usual cause, since the job still passes.
        run: |
          if [ "$FORK" = true ]; then
            echo "::notice::No SONAR_TOKEN was passed, so SonarQube Cloud did not analyse this commit."
          else
            echo "::warning::No SONAR_TOKEN reached the sonar job, so SonarQube Cloud did not analyse this commit. Either the repository (or its organization) has no SONAR_TOKEN secret, or the caller passes it with secrets: inherit to a workflow of another owner, which GitHub drops; pass SONAR_TOKEN by name under the job's secrets."
          fi
        env: { FORK: '${{ github.event.pull_request.head.repo.fork || false }}' }
      - if: env.SONAR_TOKEN != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { fetch-depth: 0 }
      - if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: coverage
          path: coverage-download
      # Properties pubkit.json adds (security.sonar.args), after the input's.
      - if: env.SONAR_TOKEN != ''
        id: settings
        # The organization: security.sonar.organization, or the owner in
        # lower case, since SonarQube Cloud's organization keys are.
        run: |
          echo "args=$(jq -r '.security.sonar.args // ""' pubkit.json 2>/dev/null)" >> "$GITHUB_OUTPUT"
          organization=$(jq -r '.security.sonar.organization // ""' pubkit.json 2>/dev/null || true)
          echo "organization=${organization:-${OWNER,,}}" >> "$GITHUB_OUTPUT"
        env: { OWNER: '${{ github.repository_owner }}' }
      - if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        with:
          args: >-
            -Dsonar.organization=${{ steps.settings.outputs.organization }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            -Dsonar.rust.lcov.reportPaths=coverage-download/lcov.info
            -Dsonar.python.coverage.reportPaths=coverage-download/*.xml
            ${{ inputs.sonar-args }}
            ${{ steps.settings.outputs.args }}

  # The one check a ruleset requires. A skipped job counts as passing a
  # required check, so requiring the jobs above directly would let a PR
  # merge when gates failed and the rest were skipped; this job always runs
  # and passes only if every job it needs succeeded. A job may be skipped
  # only because it was not asked for: anything skipped because gates
  # failed fails here through gates itself.
  passed:
    if: always()
    needs: [plan, gates, test, functional, msrv, fuzz, cross, audit, osv, review, toolchains, sonar]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
        env: { RESULTS: '${{ toJSON(needs) }}' }
