# Applies a Terraform stack from the default branch, as a Google account it
# gets through Workload Identity Federation: no key is kept anywhere.
#
#   on:
#     push: { branches: [main] }
#     workflow_dispatch: {}
#   permissions: { contents: read, id-token: write, pull-requests: read }
#   jobs:
#     terraform:
#       uses: Sustenaut/pubkit/.github/workflows/terraform.yml@<commit> # vX.Y.Z
#       with:
#         terraform-dir: infra
#         workload-identity-provider: projects/123456789/locations/global/workloadIdentityPools/github/providers/github-terraform
#         service-account: terraform-example@example-project.iam.gserviceaccount.com
#       secrets: inherit
#
# Nothing runs until the repository variable TERRAFORM_CI is "on", nor for
# any ref but the default branch: a first job, outside the environment,
# checks both, so no other run asks the environment for anything.
#
# On a push to the default branch, or by hand there, it plans to a file and
# applies exactly that plan, one run at a time (concurrency
# terraform-<repository>, never cancelled), so a caller sets no concurrency
# group of its own named that way. The plan is in the job's summary; the file
# never leaves the runner. Every run starts from a fresh `terraform init`,
# against the backend the stack names. Nothing runs for a pull request:
# merging it is what approves its change, and a pull request's code never
# runs with the account's credentials.
#
# A plan that deletes anything, a replacement included, is not applied unless
# the pull request merged as that commit has the label terraform-destroy. The
# job prints what would be deleted either way.
#
# The job runs in the environment named by `environment` (terraform), which
# the caller limits to the default branch (its deployment branches; GitHub
# Team allows that on a private repository, where required reviewers need
# Enterprise). Google trusts the job by its OIDC token, whose subject names
# that environment (repo:OWNER/REPO:environment:terraform, or with GitHub's
# immutable subjects repo:OWNER@OWNER_ID/REPO@REPO_ID:environment:terraform),
# so the provider and the account's workloadIdentityUser binding can trust
# that subject alone.
#
# With `secrets` (the default), every terraform command runs through the
# repository's ./pubkit secrets run, which reads its Bitwarden project with the
# environment's secret BWS_ACCESS_TOKEN (pubkit's README, "Services"); bws is
# the release's binary, checked against its sha256. Without, terraform runs
# plainly, and no token is read.
name: terraform

on:
  workflow_call:
    inputs:
      terraform-dir:
        description: Where the stack's Terraform files are, from the repository's root.
        type: string
        required: true
      workload-identity-provider:
        description: The full name of the Workload Identity Federation provider, projects/NUMBER/locations/global/workloadIdentityPools/POOL/providers/PROVIDER.
        type: string
        required: true
      service-account:
        description: The email of the account Terraform runs as.
        type: string
        required: true
      secrets:
        description: Run terraform through ./pubkit secrets run, with the secret BWS_ACCESS_TOKEN.
        type: boolean
        default: true
      environment:
        description: The environment the terraform job runs in, limited to the default branch.
        type: string
        default: terraform
    secrets:
      BWS_ACCESS_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  # Outside the environment, so a repository without TERRAFORM_CI on, or a
  # run on another ref, asks the environment for nothing.
  gate:
    runs-on: ubuntu-latest
    outputs:
      on: ${{ steps.gate.outputs.on }}
    steps:
      - name: Is Terraform CI on, and is this the default branch?
        id: gate
        env:
          TERRAFORM_CI: ${{ vars.TERRAFORM_CI }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$TERRAFORM_CI" != on ]]; then
            echo "::notice::TERRAFORM_CI is not on: nothing is planned or applied"
          elif [[ "$EVENT" != push && "$EVENT" != workflow_dispatch || "$REF" != "refs/heads/$BRANCH" ]]; then
            echo "::notice::$EVENT on $REF: only a push to $BRANCH, or a run by hand there, is applied"
          else
            echo "on=true" >> "$GITHUB_OUTPUT"
          fi

  terraform:
    needs: gate
    if: needs.gate.outputs.on == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    # Applies wait for each other, and are never cancelled.
    concurrency:
      group: terraform-${{ github.repository }}
      cancel-in-progress: false
    env:
      DIR: ${{ inputs.terraform-dir }}
      SECRETS: ${{ inputs.secrets }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }

      - name: Read the inputs
        env:
          HAS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN != '' }}
          TF: ${{ runner.temp }}/terraform-run
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ -d "$DIR" ]] || fail "terraform-dir: $DIR is not a directory"
          if [[ "$SECRETS" == true ]]; then
            [[ -x ./pubkit ]] || fail "secrets: this repository has no ./pubkit to run terraform through"
            [[ "$HAS_TOKEN" == true ]] || fail "secrets: the environment has no secret BWS_ACCESS_TOKEN"
          fi
          # One command for every terraform call: through ./pubkit secrets
          # run, or plainly.
          if [[ "$SECRETS" == true ]]; then
            run='./pubkit secrets run -- terraform'
          else
            run=terraform
          fi
          cat > "$TF" <<EOF
          #!/usr/bin/env bash
          exec $run -chdir="\$DIR" "\$@"
          EOF
          chmod +x "$TF"
          echo "TF=$TF" >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with: { terraform_wrapper: false }

      # ./pubkit runs the pinned pubkit with uvx. No cache: another
      # workflow's run must leave nothing an apply would restore.
      - if: inputs.secrets
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { version: 0.12.18, enable-cache: false }

      - name: Install bws
        if: inputs.secrets
        env:
          VERSION: 2.1.0
          SHA256: ba8233c3a4aee5d43e3c73bbd04d99e9bc5aba13bbbfd06d89b073abe732b860
        run: |
          zip="bws-x86_64-unknown-linux-gnu-${VERSION}.zip"
          curl -fsSLo "$RUNNER_TEMP/$zip" "https://github.com/bitwarden/sdk-sm/releases/download/bws-v${VERSION}/$zip"
          echo "${SHA256}  $RUNNER_TEMP/$zip" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/bin"
          unzip -q -o "$RUNNER_TEMP/$zip" bws -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
          service_account: ${{ inputs.service-account }}

      - name: terraform init
        env:
          BWS_ACCESS_TOKEN: ${{ inputs.secrets && secrets.BWS_ACCESS_TOKEN || '' }}
        run: '"$TF" init -input=false'

      - name: terraform plan -out
        id: plan
        env:
          BWS_ACCESS_TOKEN: ${{ inputs.secrets && secrets.BWS_ACCESS_TOKEN || '' }}
        run: |
          code=0
          "$TF" plan -input=false -no-color -detailed-exitcode -out=tfplan > "$RUNNER_TEMP/plan.txt" 2>&1 || code=$?
          cat "$RUNNER_TEMP/plan.txt"
          {
            echo "### terraform plan: $DIR"
            echo
            echo '```text'
            head -c 900000 "$RUNNER_TEMP/plan.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case "$code" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changes=true" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac

      # A delete is applied only when the pull request that made this commit
      # says so, with the label terraform-destroy.
      - name: Does it delete anything?
        if: steps.plan.outputs.changes == 'true'
        env:
          BWS_ACCESS_TOKEN: ${{ inputs.secrets && secrets.BWS_ACCESS_TOKEN || '' }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          "$TF" show -json tfplan > "$RUNNER_TEMP/plan.json"
          deletes=$(jq -r '.resource_changes[]? | select(.change.actions | index("delete"))
            | "\(.address) (\(.change.actions | join(", ")))"' "$RUNNER_TEMP/plan.json")
          [[ -n "$deletes" ]] || { echo "Nothing is deleted."; exit 0; }
          echo "This plan deletes:"
          echo "$deletes"
          labels=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq '[.[] | select(.merged_at != null)] | first | .labels // [] | .[].name')
          if grep -qxF terraform-destroy <<<"$labels"; then
            echo "::notice::The merged pull request has the label terraform-destroy: the deletes are applied"
          else
            echo "::error::The plan deletes what is listed above, and no merged pull request for $SHA has the label terraform-destroy: nothing is applied"
            exit 1
          fi

      - name: terraform apply
        if: steps.plan.outputs.changes == 'true'
        env:
          BWS_ACCESS_TOKEN: ${{ inputs.secrets && secrets.BWS_ACCESS_TOKEN || '' }}
        run: '"$TF" apply -input=false -no-color tfplan'
