# Builds a service's image, pushes it to GitHub's container registry, renders its
# kustomize overlays with that image and sends each to a k3s server over SSH, where
# the deploy key can only run one program (a forced command) that applies what it
# reads in the namespace its command names, and waits. It deploys a commit only once
# the workflows `require` names have passed on it, and only while it is still the
# head of the default branch, so a deploy never races the tests, nor an older commit
# a newer one.
#
#   on:
#     workflow_run: { workflows: [main], types: [completed], branches: [main] }
#     workflow_dispatch: {}
#   permissions: { actions: read, contents: read, packages: write }
#   jobs:
#     deploy:
#       uses: Sustenaut/pubkit/.github/workflows/k8s-deploy.yml@<commit> # vX.Y.Z
#       with:
#         image: ghcr.io/example/example-app
#         deploys: |
#           k8s example
#           k8s-other example-other DEPLOY_OTHER
#         check: docker run --rm "$IMAGE" python -c 'import example.main'
#       secrets: inherit
#
# Started by workflow_run, it deploys the commit that run tested, when the run passed
# on a push to the default branch, and skips every job otherwise: a pull request's or
# the merge queue's run never deploys. However it starts (workflow_run, a push, by
# hand), the ready job waits, up to `wait` minutes, for the latest push run on that
# commit of each workflow `require` names, and fails if one did not pass. A name
# starting with ? is waited for only where the repository has that workflow.
#
# Each line of deploys is an overlay directory, the unit the server's program
# deploys it as, and optionally a variable that must be "on" for that unit to
# deploy (for a unit whose namespace and Secrets are not on the server yet). Every
# overlay is rendered on every run, so a broken one fails even when it is off.
#
# The server is the variable SUSTENAUT_SERVER, its host key SUSTENAUT_KNOWN_HOSTS,
# the key the secret SUSTENAUT_DEPLOY_SSH_KEY. SSH is reachable over a tailnet only,
# so the job joins it first as tag:ci, with the secrets TS_GH_OAUTH_CLIENT_ID and
# TS_GH_OAUTH_SECRET. The deploy job runs in the environment named by
# `environment` (server), so a public repository can keep these to main; secrets
# set on the repository instead reach it too. Without SUSTENAUT_SERVER the image
# is built and pushed, and nothing is deployed.
#
# A unit deploys one run at a time (concurrency deploy-<unit>), so a caller sets no
# concurrency group of its own named that way.
name: k8s-deploy

on:
  workflow_call:
    inputs:
      image:
        description: The image, without a tag, such as ghcr.io/example/example-app. It is tagged with the commit.
        type: string
        required: true
      deploys:
        description: One line per unit, "DIR UNIT [VARIABLE]"; the unit deploys only when VARIABLE, if given, is "on".
        type: string
        required: true
      check:
        description: A command run once the image is built, before it is pushed, with the image in IMAGE.
        type: string
        default: ''
      render:
        description: A command run in each overlay directory after its image is set and before it is built, such as kustomize edit add configmap, with the caller's variables as JSON in VARS.
        type: string
        default: ''
      build-args:
        description: Build arguments, one NAME=value per line.
        type: string
        default: ''
      environment:
        description: The environment the deploy job runs in.
        type: string
        default: server
      require:
        description: The workflows, by name and space-separated, that must have passed on a push of the commit before it deploys; a name starting with ? only where the repository has it.
        type: string
        default: main ?integrations
      wait:
        description: The minutes the ready job waits for those workflows to finish.
        type: number
        default: 30
    secrets:
      SUSTENAUT_DEPLOY_SSH_KEY:
        required: false
      TS_GH_OAUTH_CLIENT_ID:
        required: false
      TS_GH_OAUTH_SECRET:
        required: false

permissions:
  contents: read

jobs:
  # The commit to deploy, once every workflow require names has passed on it. A
  # workflow_run that did not pass, or ran for a pull request, the merge queue or
  # another branch, skips it, and every job after it.
  ready:
    if: >-
      github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.passed.outputs.sha }}
    steps:
      - name: Wait for the commit's checks
        id: passed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REQUIRE: ${{ inputs.require }}
          WAIT: ${{ inputs.wait }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || fail "no commit to deploy: '$SHA'"
          [[ "$WAIT" =~ ^[0-9]+$ ]] || fail "wait: '$WAIT' is not a number of minutes"
          known=$(gh api --paginate "repos/$REPO/actions/workflows" --jq '.workflows[].name')
          read -r -a wanted <<<"$REQUIRE"
          names=()
          for name in "${wanted[@]}"; do
            optional=false
            if [[ "$name" == '?'* ]]; then optional=true; name=${name#'?'}; fi
            if ! grep -qxF -- "$name" <<<"$known"; then
              [[ "$optional" == true ]] || fail "require: $REPO has no workflow named $name"
              echo "$REPO has no workflow named $name, so it is not waited for."
              continue
            fi
            names+=("$name")
          done
          # A run is listed a moment after its push; one that has not started by
          # then never will, as for a commit pushed nowhere the workflow runs.
          deadline=$((SECONDS + WAIT * 60)) start=$((SECONDS + ${GRACE:-300}))
          declare -A passed=()
          while :; do
            runs=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&event=push&per_page=100" --jq .workflow_runs)
            pending=()
            for name in "${names[@]}"; do
              [[ -z "${passed[$name]:-}" ]] || continue
              run=$(jq -c --arg name "$name" '[.[] | select(.name == $name)] | sort_by(.created_at) | last // empty' <<<"$runs")
              if [[ -z "$run" ]]; then
                (( SECONDS < start )) || fail "$name has not run on a push of $SHA: nothing deploys"
                pending+=("$name"); continue
              fi
              IFS=$'\x1f' read -r status conclusion url < <(jq -r '[.status, .conclusion // "", .html_url] | join("\u001f")' <<<"$run")
              if [[ "$status" != completed ]]; then
                pending+=("$name")
              elif [[ "$conclusion" != success ]]; then
                fail "$name did not pass on $SHA ($conclusion): nothing deploys. $url"
              else
                passed[$name]=1
                echo "$name passed on $SHA: $url"
              fi
            done
            [[ ${#pending[@]} -gt 0 ]] || break
            (( SECONDS < deadline )) || fail "waited $WAIT minutes for ${pending[*]} on $SHA: nothing deploys"
            echo "Waiting for ${pending[*]} on $SHA."
            sleep "${INTERVAL:-20}"
          done
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  build:
    needs: ready
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      deploys: ${{ steps.deploys.outputs.deploys }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { ref: '${{ needs.ready.outputs.sha }}', persist-credentials: false }

      - name: Read the inputs
        id: deploys
        env:
          IMAGE: ${{ inputs.image }}
          DEPLOYS: ${{ inputs.deploys }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$IMAGE" =~ ^[a-z0-9][a-z0-9._/-]*$ && "$IMAGE" != *:* ]] ||
            fail "image: '$IMAGE' is not an image name in lower case, without a tag"
          deploys=$(jq -cnR '[inputs | gsub("^\\s+|\\s+$"; "") | select(length > 0)
            | [splits("\\s+")] | {dir: .[0], unit: .[1], gate: (.[2] // ""), words: length}]' <<<"$DEPLOYS")
          [[ $(jq length <<<"$deploys") -gt 0 ]] || fail "deploys: no units"
          # Fields split on a unit separator: a tab is whitespace to read, and runs of it collapse.
          while IFS=$'\x1f' read -r dir unit gate words; do
            [[ "$words" -le 3 && -n "$unit" ]] || fail "deploys: '$dir $unit $gate' is not DIR UNIT [VARIABLE]"
            [[ -f "$dir/kustomization.yaml" ]] || fail "deploys: $dir has no kustomization.yaml"
            [[ "$unit" =~ ^[a-z][a-z0-9-]{0,30}$ ]] || fail "deploys: '$unit' is not a unit name"
            [[ -z "$gate" || "$gate" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || fail "deploys: '$gate' is not a variable name"
          done < <(jq -r '.[] | [.dir, .unit // "", .gate, (.words | tostring)] | join("\u001f")' <<<"$deploys")
          echo "deploys=$(jq -c 'map(del(.words))' <<<"$deploys")" >> "$GITHUB_OUTPUT"
          echo "scope=${IMAGE##*/}" >> "$GITHUB_OUTPUT"

      - name: Build the image
        uses: Sustenaut/pubkit/actions/docker-build@0e5477594d4ce20e411721c86d40a6547f026db9 # v0.29.0
        with:
          tags: ${{ inputs.image }}:${{ needs.ready.outputs.sha }}
          scope: ${{ steps.deploys.outputs.scope }}
          build-args: ${{ inputs.build-args }}

      - name: Check the image
        if: inputs.check != ''
        env:
          IMAGE: ${{ inputs.image }}:${{ needs.ready.outputs.sha }}
        run: ${{ inputs.check }}

      - name: Push the image
        env:
          IMAGE: ${{ inputs.image }}:${{ needs.ready.outputs.sha }}
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$IMAGE"

  deploy:
    name: deploy ${{ matrix.unit }}
    needs: [ready, build]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.deploys) }}
    concurrency:
      group: deploy-${{ matrix.unit }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { ref: '${{ needs.ready.outputs.sha }}', persist-credentials: false }

      - name: Set the image
        working-directory: ${{ matrix.dir }}
        env:
          IMAGE: ${{ inputs.image }}
          SHA: ${{ needs.ready.outputs.sha }}
        run: kustomize edit set image "${IMAGE}=${IMAGE}:${SHA}"

      - name: Prepare the overlay
        if: inputs.render != ''
        working-directory: ${{ matrix.dir }}
        env:
          VARS: ${{ toJSON(vars) }}
        run: ${{ inputs.render }}

      - name: Render the manifests
        working-directory: ${{ matrix.dir }}
        env:
          IMAGE: ${{ inputs.image }}
          SHA: ${{ needs.ready.outputs.sha }}
          OUT: ${{ runner.temp }}/${{ matrix.unit }}.yaml
        run: |
          kustomize build . > "$OUT"
          grep -q "${IMAGE}:${SHA}" "$OUT" || { echo "::error::$OUT does not use ${IMAGE}:${SHA}"; exit 1; }

      # Inside the unit's concurrency group: a commit the default branch has moved
      # on from is not deployed over a newer one, whose own run deploys it. A
      # deploy by hand deploys the commit it is given.
      - name: Is it deployed?
        id: gate
        env:
          SERVER: ${{ vars.SUSTENAUT_SERVER }}
          UNIT: ${{ matrix.unit }}
          GATE: ${{ matrix.gate }}
          GATE_VALUE: ${{ matrix.gate != '' && vars[matrix.gate] || '' }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.event.repository.default_branch }}
          SHA: ${{ needs.ready.outputs.sha }}
        run: |
          head=$SHA
          if [[ "$EVENT" != workflow_dispatch ]]; then
            head=$(gh api "repos/$REPO/branches/$BRANCH" --jq .commit.sha)
          fi
          if [[ -z "$SERVER" ]]; then
            echo "::notice::SUSTENAUT_SERVER is not set: nothing is deployed"
          elif [[ -n "$GATE" && "$GATE_VALUE" != on ]]; then
            echo "::notice::$GATE is not on: $UNIT is not deployed"
          elif [[ "$head" != "$SHA" ]]; then
            echo "::notice::$BRANCH has moved on from $SHA to $head, which its own run deploys: $UNIT is not deployed"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to the server
        if: steps.gate.outputs.deploy == 'true'
        uses: Sustenaut/pubkit/actions/deploy-ssh@3d43a4297c92725f8dac383ed4019c4ead0573c4 # v0.30.0
        with:
          command: ${{ matrix.unit }}
          input: ${{ runner.temp }}/${{ matrix.unit }}.yaml
          deploy-key: ${{ secrets.SUSTENAUT_DEPLOY_SSH_KEY }}
          target: deploy@${{ vars.SUSTENAUT_SERVER }}
          known-hosts: ${{ vars.SUSTENAUT_KNOWN_HOSTS }}
          tailscale-oauth-client-id: ${{ secrets.TS_GH_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret: ${{ secrets.TS_GH_OAUTH_SECRET }}
