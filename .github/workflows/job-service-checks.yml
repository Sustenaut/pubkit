# A service's checks, without secrets: pubkit's managed files in step, and
# shellcheck on the scripts.
#
# One job of the CI `pubkit sync` writes from the ci block of pubkit.json
# (src/pubkit/ci.py), so a repository runs only the jobs it asks for and
# none shows as skipped.
name: job-service-checks

on:
  workflow_call:
    inputs:
      runs-on: { type: string, default: ubuntu-latest, description: "The runner label the job runs on, from pubkit.json's ci.runs-on: a self-hosted runner scale set, or GitHub's ubuntu-latest." }
      python-version: { type: string, default: '3.14' }
      shellcheck: { type: string, default: with-secrets, description: 'Shell scripts to check: space-separated globs.' }
      sync-check: { type: boolean, default: true, description: Fail if pubkit's managed files drifted. }

jobs:
  checks:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '${{ inputs.python-version }}' }
      - if: inputs.sync-check
        name: pubkit's managed files are in step
        run: |
          python3 -m venv .pubkit
          # Tried three times, then from the wheel mirror: a release download can time out.
          tests/install-lock .pubkit/bin/pip
          .pubkit/bin/pubkit sync --check
      - name: shell scripts pass shellcheck
        run: |
          shopt -s globstar nullglob
          files=($SCRIPTS)
          if [ ${#files[@]} -gt 0 ]; then shellcheck --severity=warning "${files[@]}"; fi
        env: { SCRIPTS: '${{ inputs.shellcheck }}' }
