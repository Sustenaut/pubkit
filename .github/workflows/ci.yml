name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  # pubkit is its own first consumer: its suite runs through the workflow it
  # provides, from this checkout, so a change to it is tested before a
  # release carries it to anyone else. It installs itself from source, not
  # from a released wheel, so there are no managed files to check.
  #
  # SonarQube Cloud looks for a lock beside each manifest. pubkit's own lock
  # is tests/requirements.lock (pip, with hashes), a format it does not
  # read, and the crate templates under src/pubkit/templates get their
  # Cargo.lock from `cargo generate-lockfile` when `pubkit new` starts a
  # crate, so neither rule applies to these files. The suite's own steps
  # are not code it measures.
  #
  # The jobs are the ones `pubkit sync` puts in a utility's generated
  # workflows (src/pubkit/ci.py), from this checkout.
  functional:
    name: ci
    uses: ./.github/workflows/job-python-functional.yml
    with:
      sync-check: false
      test: make check

  audit:
    name: ci
    uses: ./.github/workflows/job-python-audit.yml

  osv:
    name: ci
    uses: ./.github/workflows/job-osv.yml

  # A generated workflow has it only for pull requests; this one runs on
  # pushes too, so it says so here.
  review:
    if: github.event_name == 'pull_request'
    name: ci
    uses: ./.github/workflows/job-review.yml

  sonar:
    name: ci
    needs: functional
    uses: ./.github/workflows/job-sonar.yml
    with:
      reports: sonar.python.coverage.reportPaths=*.xml
      layout: -Dsonar.sources=src -Dsonar.tests=tests
      sonar-args: >-
        -Dsonar.coverage.exclusions=tests/**
        -Dsonar.issue.ignore.multicriteria=pylock,cargolock
        -Dsonar.issue.ignore.multicriteria.pylock.ruleKey=text:S8565
        -Dsonar.issue.ignore.multicriteria.pylock.resourceKey=pyproject.toml
        -Dsonar.issue.ignore.multicriteria.cargolock.ruleKey=text:S8570
        -Dsonar.issue.ignore.multicriteria.cargolock.resourceKey=src/pubkit/templates/**/Cargo.toml
    secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }

  # The one check pubkit's ruleset requires. review is skipped on a push.
  passed:
    name: ci / passed
    if: always()
    needs: [functional, audit, osv, review, sonar]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(to_entries[];
            .value.result == "success" or (.key == "review" and .value.result == "skipped"))' > /dev/null
        env: { RESULTS: '${{ toJSON(needs) }}' }

  # The hosting modules (terraform/) and the deploy-static action
  # (actions/), which consumers take by tag from this repository. Each
  # module's tests mock its providers, so nothing here needs credentials.
  # Terraform is the oldest version the modules allow, 1.11.
  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [dns-zone, hosting, cloud-run-sites, desec-zones]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with: { terraform_version: 1.11.4, terraform_wrapper: false }
      - run: terraform -chdir="terraform/$MODULE" fmt -check -recursive
        env: { MODULE: '${{ matrix.module }}' }
      - run: terraform -chdir="terraform/$MODULE" init -backend=false -input=false
        env: { MODULE: '${{ matrix.module }}' }
      - run: terraform -chdir="terraform/$MODULE" validate
        env: { MODULE: '${{ matrix.module }}' }
      - run: terraform -chdir="terraform/$MODULE" test
        env: { MODULE: '${{ matrix.module }}' }

  deploy-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: shellcheck actions/deploy-static/*.sh
      - run: actions/deploy-static/test.sh

  # review is skipped on a push, and a job runs by default only when every
  # job before it, however far back, succeeded: without the condition, a
  # push to main skips the release (and the wheel), so nothing is tagged.
  release:
    needs: [passed, terraform, deploy-static]
    if: >-
      !cancelled() && needs.passed.result == 'success'
      && needs.terraform.result == 'success' && needs.deploy-static.result == 'success'
    uses: Sustenaut/pubrel/.github/workflows/release.yml@986872816b1bd11e177e3f664318c35d41dd08f2 # v0.6.0
    with: { pubrel-version: v0.6.0 }
    permissions:
      contents: write

  # Consumers lock the wheel by URL and sha256, so each release carries it.
  # Built once, when the release appears, and never replaced, from the
  # release's tag, with the commit the tag names in it as release-commit:
  # `pubkit sync` pins pubkit's workflows to that commit (src/pubkit/refs.py)
  # without asking the network.
  wheel:
    needs: release
    if: >-
      !cancelled() && needs.release.result == 'success'
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.14' }
      - run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          wheel="pubkit-$version-py3-none-any.whl"
          gh release view "v$version" >/dev/null 2>&1 || { echo "v$version is not released"; exit 0; }
          gh release view "v$version" --json assets --jq '.assets[].name' | grep -qx "$wheel" && { echo "$wheel already attached"; exit 0; }
          git fetch --quiet --depth 1 origin tag "v$version"
          git checkout --quiet "v$version"
          git rev-parse "v$version^{commit}" > src/pubkit/release-commit
          python -m pip wheel --no-deps . -w dist
          unzip -p "dist/$wheel" pubkit/release-commit | grep -qxE '[0-9a-f]{40}'
          gh release upload "v$version" "dist/$wheel"
        env:
          GH_TOKEN: ${{ github.token }}
