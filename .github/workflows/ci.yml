name: ci

on:
  push: { branches: [main] }
  pull_request:
  # The merge queue's run of a pull request merged into main: the required
  # checks must report on it too, or nothing leaves the queue.
  merge_group:

jobs:
  # pubkit is its own first consumer: its suite runs through the workflow it
  # provides, from this checkout, so a change to it is tested before a
  # release carries it to anyone else. It installs itself from source, not
  # from a released wheel, so there are no managed files to check.
  #
  # SonarQube Cloud looks for a lock beside each manifest. pubkit's own lock
  # is tests/requirements.lock (pip, with hashes), a format it does not
  # read, and the crate templates under src/pubkit/templates get their
  # Cargo.lock from `cargo generate-lockfile` when `pubkit new` starts a
  # crate, so neither rule applies to these files. The suite's own steps
  # are not code it measures.
  #
  # The jobs are the ones `pubkit sync` puts in a utility's generated
  # workflows (src/pubkit/ci.py), from this checkout.
  #
  # In the merge queue and on a push to main, tested asks whether an
  # earlier run already passed on this commit's tree (a pull request up to
  # date with main merges as the very files its own run tested, and merging
  # moves main to the very commit the queue tested); then the jobs that only
  # test it are skipped, and the scan reads that run's coverage. On a pull
  # request it is skipped, and everything runs.
  tested:
    if: github.event_name != 'pull_request'
    name: ci
    uses: ./.github/workflows/job-tested.yml
    with: { workflow: .github/workflows/ci.yml }
    permissions:
      actions: read
      contents: read

  functional:
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    name: ci
    uses: ./.github/workflows/job-python-functional.yml
    with:
      sync-check: false
      test: make check

  audit:
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    name: ci
    uses: ./.github/workflows/job-python-audit.yml

  osv:
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    name: ci
    uses: ./.github/workflows/job-osv.yml

  # A generated workflow has it only for pull requests and the merge
  # queue; this one runs on pushes too, so it says so here. The queue's run
  # adds no dependency its pull request's run did not review.
  review:
    if: github.event_name == 'pull_request'
    name: ci
    uses: ./.github/workflows/job-review.yml

  # cachecmd: `pubkit cache run ... -- COMMAND` exists to run the command
  # its caller typed, as make runs a recipe; S8705 reads that as injection.
  # The ignore names the rule and cache.py only.
  #
  # Not in the merge queue: SonarQube Cloud analyses pull requests and main,
  # and refuses the queue's gh-readonly-queue branch ("not allowed to access
  # data from non main branches"). The pull request's run scanned its
  # changes, and main's push scans the merge.
  sonar:
    name: ci
    needs: [tested, functional]
    if: ${{ github.event_name != 'merge_group' && !failure() && !cancelled() }}
    uses: ./.github/workflows/job-sonar.yml
    permissions:
      actions: read
      contents: read
    with:
      coverage-run: ${{ needs.tested.outputs.run-id }}
      reports: sonar.python.coverage.reportPaths=*.xml
      layout: -Dsonar.sources=src -Dsonar.tests=tests
      sonar-args: >-
        -Dsonar.coverage.exclusions=tests/**
        -Dsonar.issue.ignore.multicriteria=pylock,cargolock,cachecmd
        -Dsonar.issue.ignore.multicriteria.pylock.ruleKey=text:S8565
        -Dsonar.issue.ignore.multicriteria.pylock.resourceKey=pyproject.toml
        -Dsonar.issue.ignore.multicriteria.cargolock.ruleKey=text:S8570
        -Dsonar.issue.ignore.multicriteria.cargolock.resourceKey=src/pubkit/templates/**/Cargo.toml
        -Dsonar.issue.ignore.multicriteria.cachecmd.ruleKey=pythonsecurity:S8705
        -Dsonar.issue.ignore.multicriteria.cachecmd.resourceKey=src/pubkit/cache.py
    secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }

  # The one check pubkit's ruleset requires. review is skipped on a push
  # and in the merge queue, sonar in the merge queue, tested on a pull
  # request, and every testing job where an earlier run already passed on
  # the commit's tree.
  passed:
    name: ci / passed
    if: always()
    needs: [tested, functional, audit, osv, review, sonar]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e --arg tested "$TESTED" --arg event "$EVENT" 'all(to_entries[];
            .value.result == "success" or (.value.result == "skipped"
              and (.key == "review" or .key == "tested" or $tested == "true"
                or (.key == "sonar" and $event == "merge_group"))))' > /dev/null
        env: { RESULTS: '${{ toJSON(needs) }}', TESTED: '${{ needs.tested.outputs.tested }}', EVENT: '${{ github.event_name }}' }

  cache-action:
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: shellcheck actions/*/*.sh
      - run: actions/cache/test.sh
      - run: actions/pr-label/test.sh

  # review is skipped on a push, and a job runs by default only when every
  # job before it, however far back, succeeded: without the condition, a
  # push to main skips the release (and the wheel), so nothing is tagged.
  # On a pull request or in the merge queue it only reports the check:
  # pubrel tags from a push to main alone, as the wheel is built. Where
  # the queue already passed the commit, its run of these jobs counts.
  release:
    needs: [passed, tested, cache-action]
    if: >-
      !cancelled() && needs.passed.result == 'success'
      && (needs.tested.outputs.tested == 'true' || needs.cache-action.result == 'success')
    uses: Sustenaut/pubrel/.github/workflows/release.yml@5395ddd816d9530b649b92ed0b8b3cfdfe87d7dc # v0.6.1
    with: { pubrel-version: v0.6.1 }
    # The release app's token tags the release: the tag ruleset lets only
    # it through.
    secrets: { RELEASE_APP_ID: '${{ secrets.RELEASE_APP_ID }}', RELEASE_APP_KEY: '${{ secrets.RELEASE_APP_KEY }}' }
    permissions:
      contents: write

  # Consumers lock the wheel by URL and sha256, so each release carries it.
  # Built once, when the release appears, and never replaced, from the
  # release's tag, with the commit the tag names in it as release-commit:
  # `pubkit sync` pins pubkit's workflows to that commit (src/pubkit/refs.py)
  # without asking the network.
  wheel:
    needs: release
    if: >-
      !cancelled() && needs.release.result == 'success'
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.14' }
      - run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          wheel="pubkit-$version-py3-none-any.whl"
          gh release view "v$version" >/dev/null 2>&1 || { echo "v$version is not released"; exit 0; }
          gh release view "v$version" --json assets --jq '.assets[].name' | grep -qx "$wheel" && { echo "$wheel already attached"; exit 0; }
          git fetch --quiet --depth 1 origin tag "v$version"
          git checkout --quiet "v$version"
          git rev-parse "v$version^{commit}" > src/pubkit/release-commit
          python -m pip wheel --no-deps . -w dist
          unzip -p "dist/$wheel" pubkit/release-commit | grep -qxE '[0-9a-f]{40}'
          gh release upload "v$version" "dist/$wheel"
        env:
          GH_TOKEN: ${{ github.token }}
