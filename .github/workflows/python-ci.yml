# Reusable CI for a Python package's functional suite:
#
#   ci:
#     uses: schryer/pubkit/.github/workflows/python-ci.yml@vX.Y.Z
#     with: { browser-test: ./dev test --browser }
#     secrets: inherit
#
# The commands are inputs, so a repository with its own entry point (a
# ./dev script, tox) keeps it; the defaults are pubkit.mk's targets.
#
# The audit job checks the hash-locked requirements against the Python
# advisories (pip-audit) on every run, nightly included, and fails on any
# finding. It has no switch.
name: python-ci

on:
  workflow_call:
    inputs:
      python-version: { type: string, default: '3.14' }
      apt-packages: { type: string, default: '', description: Extra Ubuntu packages to install first. }
      setup: { type: string, default: make venv, description: Creates .venv from the hash-locked requirements. }
      test: { type: string, default: make functional, description: Runs the default scenarios. }
      browser-test: { type: string, default: '', description: Runs the browser scenarios too; empty skips the browser job. }
      browser-setup: { type: string, default: .venv/bin/python -m playwright install --with-deps chromium }
      sync-check: { type: boolean, default: true, description: Fail if pubkit's managed files drifted. }
      sonar-args: { type: string, default: '', description: "Extra SonarQube Cloud properties for the sonar job, such as -Dsonar.exclusions=vendor/**." }
      coverage-report: { type: string, default: coverage/coverage.xml, description: "The Cobertura XML report the test command writes, if any, which the sonar job reads." }
      audit-requirements: { type: string, default: tests/requirements.lock, description: "The hash-locked requirements files the audit job checks, space-separated." }
    secrets:
      SONAR_TOKEN: { required: false, description: "A SonarQube Cloud token: with it, the sonar job analyses the code. Pass it with secrets: inherit." }

jobs:
  functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '${{ inputs.python-version }}' }
      - if: inputs.apt-packages != ''
        run: sudo apt-get update && sudo apt-get install -y $APT
        env: { APT: '${{ inputs.apt-packages }}' }
      - run: ${{ inputs.setup }}
      - if: inputs.sync-check
        run: .venv/bin/pubkit sync --check
      - run: ${{ inputs.test }}
      # The sonar job runs elsewhere, so the report goes to it as an artifact.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: ${{ inputs.coverage-report }}
          if-no-files-found: ignore
          retention-days: 1

  browser:
    if: inputs.browser-test != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '${{ inputs.python-version }}' }
      - if: inputs.apt-packages != ''
        run: sudo apt-get update && sudo apt-get install -y $APT
        env: { APT: '${{ inputs.apt-packages }}' }
      - run: ${{ inputs.setup }}
      - run: ${{ inputs.browser-setup }}
      - run: ${{ inputs.browser-test }}

  # Every locked requirement against the Python advisories, by pip-audit,
  # which reads the files without installing them.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '${{ inputs.python-version }}' }
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: ${{ inputs.audit-requirements }}
          require-hashes: true

  # SonarQube Cloud's analysis, into the project OWNER_REPO of the
  # organization OWNER, when the caller passes a SONAR_TOKEN. Without one, as
  # in a private repository or a pull request from a fork, it says so and
  # passes. The full history lets it tell new code from old, and the
  # functional job's coverage report, when its test command wrote one, gives
  # the coverage SonarQube Cloud's quality gate asks of new code.
  sonar:
    needs: functional
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - if: env.SONAR_TOKEN == ''
        run: echo "::notice::No SONAR_TOKEN was passed, so SonarQube Cloud did not analyse this commit."
      - if: env.SONAR_TOKEN != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { fetch-depth: 0 }
      - if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: coverage
          path: coverage-download
      - if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        with:
          args: >-
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.python.coverage.reportPaths=coverage-download/*.xml
            ${{ inputs.sonar-args }}

  # The one check a ruleset requires. A skipped job counts as passing a
  # required check, so this job always runs and passes only if every job it
  # needs succeeded -- the browser job may be skipped only when no
  # browser-test was asked for.
  passed:
    if: always()
    needs: [functional, browser, audit, sonar]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e --arg browser "$BROWSER" '
            all(to_entries[];
                .value.result == "success"
                or (.key == "browser" and $browser == "" and .value.result == "skipped"))' > /dev/null
        env:
          RESULTS: '${{ toJSON(needs) }}'
          BROWSER: '${{ inputs.browser-test }}'
