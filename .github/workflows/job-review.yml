# A pull request's dependency changes against GitHub's advisories. pubkit
# puts it in the pull request workflow only, and only for a public
# repository, where GitHub's dependency graph serves it.
#
# One job of the CI `pubkit sync` writes from the ci block of pubkit.json
# (src/pubkit/ci.py), so a repository runs only the jobs it asks for and
# none shows as skipped.
name: job-review

on:
  workflow_call:

jobs:
  # A pull request that adds or moves a dependency to a version with a
  # known vulnerability fails here, before it merges. GitHub's dependency
  # graph serves it for public repositories only.
  review:
    runs-on: ubuntu-latest
    steps:
      # Sustenaut's own reusable workflows and actions carry no license GitHub
      # can read: they are left out of the license check alone, each by name
      # (v5.0.0 matches a purl's full name, with no wildcard). Advisories
      # still apply to them, and everything else is checked as before.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          allow-dependencies-licenses: >-
            pkg:githubactions/Sustenaut/pubkit/.github/workflows/board.yml,
            pkg:githubactions/Sustenaut/pubkit/.github/workflows/deploy-check.yml,
            pkg:githubactions/Sustenaut/pubkit/.github/workflows/job-node-audit.yml,
            pkg:githubactions/Sustenaut/pubkit/.github/workflows/job-node-browser.yml,
            pkg:githubactions/Sustenaut/pubkit/.github/workflows/job-node-test.yml,
            pkg:githubactions/Sustenaut/pubkit/.github/workflows/job-osv.yml,
            pkg:githubactions/Sustenaut/pubkit/.github/workflows/job-python-audit.yml,
            pkg:githubactions/Sustenaut/pubkit/.github/workflows/job-python-browser.yml,
            pkg:githubactions/Sustenaut/pubkit/.github/workflows/job-python-functional.yml,
            pkg:githubactions/Sustenaut/pubkit/.github/workflows/job-review.yml,
            pkg:githubactions/Sustenaut/pubkit/.github/workflows/job-rust-audit.yml,
            pkg:githubactions/Sustenaut/pubkit/.github/workflows/job-rust-cross.yml,
            pkg:githubactions/Sustenaut/pubkit/.github/workflows/job-rust-functional.yml,
            pkg:githubactions/Sustenaut/pubkit/.github/workflows/job-rust-fuzz.yml,
            pkg:githubactions/Sustenaut/pubkit/.github/workflows/job-rust-gates.yml,
            pkg:githubactions/Sustenaut/pubkit/.github/workflows/job-rust-msrv.yml,
            pkg:githubactions/Sustenaut/pubkit/.github/workflows/job-rust-test.yml,
            pkg:githubactions/Sustenaut/pubkit/.github/workflows/job-rust-toolchains.yml,
            pkg:githubactions/Sustenaut/pubkit/.github/workflows/job-service-checks.yml,
            pkg:githubactions/Sustenaut/pubkit/.github/workflows/job-service-terraform.yml,
            pkg:githubactions/Sustenaut/pubkit/.github/workflows/job-service-tests.yml,
            pkg:githubactions/Sustenaut/pubkit/.github/workflows/job-sonar.yml,
            pkg:githubactions/Sustenaut/pubkit/.github/workflows/job-tested.yml,
            pkg:githubactions/Sustenaut/pubkit/.github/workflows/k8s-deploy.yml,
            pkg:githubactions/Sustenaut/pubkit/.github/workflows/nightly.yml,
            pkg:githubactions/Sustenaut/pubkit/.github/workflows/node-ci.yml,
            pkg:githubactions/Sustenaut/pubkit/.github/workflows/python-ci.yml,
            pkg:githubactions/Sustenaut/pubkit/.github/workflows/rust-ci.yml,
            pkg:githubactions/Sustenaut/pubkit/.github/workflows/service-ci.yml,
            pkg:githubactions/Sustenaut/pubkit/.github/workflows/terraform.yml,
            pkg:githubactions/Sustenaut/pubkit/actions/cache,
            pkg:githubactions/Sustenaut/pubkit/actions/deploy-ssh,
            pkg:githubactions/Sustenaut/pubkit/actions/deploy-static,
            pkg:githubactions/Sustenaut/pubkit/actions/docker-build,
            pkg:githubactions/Sustenaut/pubkit/actions/pr-label,
            pkg:githubactions/Sustenaut/pubrel/.github/workflows/release.yml
