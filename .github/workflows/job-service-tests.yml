# A service's tests, without secrets: tests that need one are the
# repository's to skip. The coverage report the test command writes, if
# any, goes to the sonar job as the `coverage` artifact.
#
# One job of the CI `pubkit sync` writes from the ci block of pubkit.json
# (src/pubkit/ci.py), so a repository runs only the jobs it asks for and
# none shows as skipped.
name: job-service-tests

on:
  workflow_call:
    inputs:
      runs-on: { type: string, default: ubuntu-latest, description: "The runner label the job runs on, from pubkit.json's ci.runs-on: a self-hosted runner scale set, or GitHub's ubuntu-latest." }
      python-version: { type: string, default: '3.14' }
      setup: { type: string, default: '', description: 'Prepares the tests, for example make venv. Empty skips it.' }
      test: { type: string, required: true, description: Runs the tests. }
      coverage-report: { type: string, default: coverage/, description: "The coverage the test command writes, if any (Cobertura XML or LCOV lcov.info), which the sonar job reads." }

jobs:
  tests:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '${{ inputs.python-version }}' }
      # pip's and uv's download caches, keyed on the lock files: setup then
      # installs from the runner's disk instead of PyPI. Only downloads are
      # kept, never a venv, so a new Python patch release never meets an old
      # environment.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 5
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: service-tests-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles('**/requirements*.lock', '**/requirements*.txt', '**/uv.lock') }}
          restore-keys: service-tests-${{ runner.os }}-py${{ inputs.python-version }}-
      - if: inputs.setup != ''
        name: Set up, tried three times (a release download can time out)
        uses: Sustenaut/pubkit/actions/retry@afabaf91f5285f163967383edaadaee927e0c30a # v0.35.1
        with: { run: '${{ inputs.setup }}' }
      - run: ${{ inputs.test }}
      # The sonar job runs elsewhere, so the report goes to it as an artifact.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: coverage
          path: ${{ inputs.coverage-report }}
          if-no-files-found: ignore
          retention-days: 1
