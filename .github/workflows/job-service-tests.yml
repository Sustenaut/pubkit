# A service's tests, without secrets: tests that need one are the
# repository's to skip.
#
# One job of the CI `pubkit sync` writes from the ci block of pubkit.json
# (src/pubkit/ci.py), so a repository runs only the jobs it asks for and
# none shows as skipped.
name: job-service-tests

on:
  workflow_call:
    inputs:
      python-version: { type: string, default: '3.14' }
      setup: { type: string, default: '', description: 'Prepares the tests, for example make venv. Empty skips it.' }
      test: { type: string, required: true, description: Runs the tests. }

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '${{ inputs.python-version }}' }
      # pip's and uv's download caches, keyed on the lock files: setup then
      # installs from the runner's disk instead of PyPI. Only downloads are
      # kept, never a venv, so a new Python patch release never meets an old
      # environment.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: service-tests-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles('**/requirements*.lock', '**/requirements*.txt', '**/uv.lock') }}
          restore-keys: service-tests-${{ runner.os }}-py${{ inputs.python-version }}-
      - if: inputs.setup != ''
        run: ${{ inputs.setup }}
      - run: ${{ inputs.test }}
