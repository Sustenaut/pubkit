# SonarQube Cloud's analysis, into the project OWNER_REPO of the
# organization owner, in lower case (or pubkit.json's
# security.sonar.organization), when the caller passes a SONAR_TOKEN. Without one, as
# in a private repository or a pull request from a fork, it says so and
# passes. The full history lets it tell new code from old, and every
# coverage* artifact of the run, each in coverage-download/<artifact>/,
# gives the coverage SonarQube Cloud's quality gate asks of new code. Each
# `property=pattern` in reports sends the files whose names match the
# pattern (find -name) to that property. layout, where the code and its
# tests are, which `pubkit sync` works out, comes first: sonar-args, then
# the properties pubkit.json adds (security.sonar.args), come after it, so
# a repository's own setting of the same property wins.
#
# One job of the CI `pubkit sync` writes from the ci block of pubkit.json
# (src/pubkit/ci.py), so a repository runs only the jobs it asks for and
# none shows as skipped.
name: job-sonar

on:
  workflow_call:
    inputs:
      sonar-args: { type: string, default: '', description: "Extra SonarQube Cloud properties, such as -Dsonar.exclusions=vendor/**." }
      layout: { type: string, default: '', description: "Where the code and its tests are, as SonarQube Cloud properties, such as -Dsonar.sources=src -Dsonar.tests=tests; pubkit sync gives it from the directories the repository has. sonar-args comes after it, so the repository's own wins." }
      reports: { type: string, required: true, description: "Where the coverage reports go: space-separated property=pattern pairs, such as sonar.rust.lcov.reportPaths=lcov.info sonar.python.coverage.reportPaths=*.xml." }
    secrets:
      SONAR_TOKEN: { required: false, description: "A SonarQube Cloud token: with it, the sonar job analyses the code. Pass it by name: secrets: inherit does not reach a workflow of another owner." }

jobs:
  sonar:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - if: env.SONAR_TOKEN == ''
        # A pull request from a fork gets no secrets, by design: a notice.
        # Anything else got none because the caller passed none: a warning
        # naming the usual cause, since the job still passes.
        run: |
          if [ "$FORK" = true ]; then
            echo "::notice::No SONAR_TOKEN was passed, so SonarQube Cloud did not analyse this commit."
          else
            echo "::warning::No SONAR_TOKEN reached the sonar job, so SonarQube Cloud did not analyse this commit. Either the repository (or its organization) has no SONAR_TOKEN secret, or the caller passes it with secrets: inherit to a workflow of another owner, which GitHub drops; pass SONAR_TOKEN by name under the job's secrets."
          fi
        env: { FORK: '${{ github.event.pull_request.head.repo.fork || false }}' }
      - if: env.SONAR_TOKEN != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { fetch-depth: 0 }
      - if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: coverage*
          path: coverage-download
      # The reports keep the file names the test commands gave them.
      - if: env.SONAR_TOKEN != ''
        id: report
        run: |
          set -f
          args=()
          for report in $REPORTS; do
            paths=$(find coverage-download -type f -name "${report#*=}" 2>/dev/null | paste -sd, -)
            args+=("-D${report%%=*}=$paths")
          done
          echo "args=${args[*]}" >> "$GITHUB_OUTPUT"
        env: { REPORTS: '${{ inputs.reports }}' }
      - if: env.SONAR_TOKEN != ''
        id: settings
        # The organization: security.sonar.organization, or the owner in
        # lower case, since SonarQube Cloud's organization keys are.
        run: |
          echo "args=$(jq -r '.security.sonar.args // ""' pubkit.json 2>/dev/null)" >> "$GITHUB_OUTPUT"
          organization=$(jq -r '.security.sonar.organization // ""' pubkit.json 2>/dev/null || true)
          echo "organization=${organization:-${OWNER,,}}" >> "$GITHUB_OUTPUT"
        env: { OWNER: '${{ github.repository_owner }}' }
      - if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        with:
          args: >-
            -Dsonar.organization=${{ steps.settings.outputs.organization }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            ${{ inputs.layout }}
            ${{ steps.report.outputs.args }}
            ${{ inputs.sonar-args }}
            ${{ steps.settings.outputs.args }}
