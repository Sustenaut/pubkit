# Rust: pubkit's managed files in step, then the gates the Rust crate
# standard requires and the repository's own after them. `pubkit sync`
# gives the required targets, from the standard and pubkit.json's
# exceptions, so a change to either shows in the generated workflow, and
# the sync check fails until it is written.
#
# One job of the CI `pubkit sync` writes from the ci block of pubkit.json
# (src/pubkit/ci.py), so a repository runs only the jobs it asks for and
# none shows as skipped.
name: job-rust-gates

on:
  workflow_call:
    inputs:
      runs-on: { type: string, default: ubuntu-latest, description: "The runner label the job runs on, from pubkit.json's ci.runs-on: a self-hosted runner scale set, or GitHub's ubuntu-latest." }
      python-version: { type: string, default: '3.14' }
      required: { type: string, default: '', description: "The make targets the standard requires, which pubkit sync gives." }
      gates: { type: string, default: '', description: "Extra make targets to run after the required ones." }

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '${{ inputs.python-version }}' }
      - run: cargo --version && rustc --version
      - run: make venv
      - run: make sync-check
      - run: |
          for target in $(printf '%s\n' $REQUIRED $EXTRA | awk 'NF && !seen[$0]++'); do
            echo "::group::make $target"; make "$target"; echo "::endgroup::"
          done
        env: { REQUIRED: '${{ inputs.required }}', EXTRA: '${{ inputs.gates }}' }
