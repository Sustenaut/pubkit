# Walks a service's deploy block on a schedule, read-only: every need is
# checked, the states table printed, and the journal written to storage. A
# run whose walk is not all ready fails. `pubkit sync` seeds the caller in a
# repository with a deploy block:
#
#   on: { schedule: [{ cron: '*/30 * * * *' }], workflow_dispatch: {} }
#   permissions: { actions: read, contents: read, id-token: write }
#   jobs:
#     check:
#       uses: Sustenaut/pubkit/.github/workflows/deploy-check.yml@<commit> # vX.Y.Z
#       secrets: inherit
#
# It checks out the default branch and runs `./pubkit deploy walk --yes`
# with kubectl as the server's read-only verb, `ssh deploy@SERVER UNIT
# kubectl-read`, with the deploy key, host and tailnet secrets k8s-deploy.yml
# takes, in the same environment (server). Nothing it runs can write: the
# verb reads, the job's token reads, and no Bitwarden write token is asked
# for. With the environment's secret BWS_ACCESS_TOKEN, the read-only
# machine account's, the walk runs through ./pubkit secrets run, which puts
# the Bitwarden project's names and values in the job's environment only,
# as terraform.yml does; without it every bitwarden.* need is unknown. The
# log prints states and names, never a value.
#
# `zones` is the pubkit.json whose hosting block keeps the host's zone, in
# this repository or a checkout beside it (`zones-repository` checks one out
# there). `journal` is the storage service's address; the job signs in to it
# with its OIDC token, for the audience `storage-audience` (default the
# address's host).
name: deploy-check

on:
  workflow_call:
    inputs:
      zones:
        description: The pubkit.json whose hosting block keeps the zone, such as ../infra/pubkit.json.
        type: string
        default: ''
      zones-repository:
        description: A repository, OWNER/NAME, checked out beside this one for zones.
        type: string
        default: ''
      journal:
        description: The storage service's address, to write the journal to; empty writes none.
        type: string
        default: ''
      storage-audience:
        description: The audience of the job's OIDC token for storage; default the journal address's host.
        type: string
        default: ''
      environment:
        description: The environment the job runs in, with the deploy key and the Bitwarden token.
        type: string
        default: server
    secrets:
      SUSTENAUT_DEPLOY_SSH_KEY:
        required: false
      TS_GH_OAUTH_CLIENT_ID:
        required: false
      TS_GH_OAUTH_SECRET:
        required: false
      BWS_ACCESS_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  walk:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      actions: read
      contents: read
      id-token: write
    concurrency:
      group: deploy-check-${{ github.repository }}
      cancel-in-progress: true
    env:
      HAS_TAILNET: ${{ secrets.TS_GH_OAUTH_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { ref: '${{ github.event.repository.default_branch }}', persist-credentials: false }

      - if: inputs.zones-repository != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { repository: '${{ inputs.zones-repository }}', path: .zones, persist-credentials: false }

      - name: Read the inputs
        env:
          SERVER: ${{ vars.SUSTENAUT_SERVER }}
          KNOWN_HOSTS: ${{ vars.SUSTENAUT_KNOWN_HOSTS }}
          HAS_KEY: ${{ secrets.SUSTENAUT_DEPLOY_SSH_KEY != '' }}
          ZONES_REPOSITORY: ${{ inputs.zones-repository }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ -x ./pubkit ]] || fail "this repository has no ./pubkit to walk with"
          [[ -n "$SERVER" ]] || fail "the variable SUSTENAUT_SERVER is not set: there is no server to walk"
          [[ -n "$KNOWN_HOSTS" ]] || fail "the variable SUSTENAUT_KNOWN_HOSTS is not set: the server is never asked unpinned"
          [[ "$HAS_KEY" == true ]] || fail "the secret SUSTENAUT_DEPLOY_SSH_KEY is not set"
          if [[ -n "$ZONES_REPOSITORY" ]]; then
            # Beside this checkout, where --zones may read a pubkit.json.
            mv .zones "../${ZONES_REPOSITORY#*/}"
          fi

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { version: 0.12.18, enable-cache: false }

      - name: Install bws
        env:
          HAS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN != '' }}
          VERSION: 2.1.0
          SHA256: ba8233c3a4aee5d43e3c73bbd04d99e9bc5aba13bbbfd06d89b073abe732b860
        run: |
          [[ "$HAS_TOKEN" == true ]] || { echo "No BWS_ACCESS_TOKEN: Bitwarden is not read."; exit 0; }
          zip="bws-x86_64-unknown-linux-gnu-${VERSION}.zip"
          curl -fsSLo "$RUNNER_TEMP/$zip" "https://github.com/bitwarden/sdk-sm/releases/download/bws-v${VERSION}/$zip"
          echo "${SHA256}  $RUNNER_TEMP/$zip" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/bin"
          unzip -q -o "$RUNNER_TEMP/$zip" bws -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Join the tailnet
        if: env.HAS_TAILNET == 'true'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_GH_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_GH_OAUTH_SECRET }}
          tags: tag:ci

      - name: Walk the deploy block
        env:
          SERVER: ${{ vars.SUSTENAUT_SERVER }}
          KNOWN_HOSTS: ${{ vars.SUSTENAUT_KNOWN_HOSTS }}
          DEPLOY_KEY: ${{ secrets.SUSTENAUT_DEPLOY_SSH_KEY }}
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          ZONES: ${{ inputs.zones }}
          JOURNAL: ${{ inputs.journal }}
          PUBKIT_STORAGE_AUDIENCE: ${{ inputs.storage-audience }}
        run: |
          ssh_dir="$RUNNER_TEMP/deploy-ssh"
          mkdir -p "$ssh_dir"
          chmod 700 "$ssh_dir"
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset DEPLOY_KEY
          # {unit} is each unit's namespace, which the walk puts in.
          kubectl="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o BatchMode=yes -o UserKnownHostsFile=$ssh_dir/known_hosts deploy@$SERVER {unit} kubectl-read"
          args=(deploy walk --yes --kubectl "$kubectl")
          [[ -z "$ZONES" ]] || args+=(--zones "$ZONES")
          [[ -z "$JOURNAL" ]] || args+=(--journal "$JOURNAL")
          code=0
          if [[ -n "$BWS_ACCESS_TOKEN" ]]; then
            ./pubkit secrets run -- ./pubkit "${args[@]}" || code=$?
          else
            unset BWS_ACCESS_TOKEN
            ./pubkit "${args[@]}" || code=$?
          fi
          rm -rf "$ssh_dir"
          exit "$code"
