# Nightly: every repository the repos input marks to govern, or on pubkit's
# own schedule, every one governed.json lists, which goes in a later release.
#
# Reusable: a control plane calls this with `repos`, the repos file itself as
# JSON ({"repositories": [{"repo", "govern"}]}), and the secrets app-id, app-key,
# notify-token and notify-user. It takes the wheel and the update script from
# the `pubkit` input's latest release, whichever repository calls it.
#
# The report job checks each one out and runs `pubkit freshness`: the job
# summary is one table of the pubkit each pins, whether it conforms to the
# latest standard, and its open exceptions.
#
# The update job then keeps one pull request per repository, on its
# pubkit-nightly branch, with up to four commits (.github/nightly/update.sh):
#
# 1. every outdated pub* pin: the latest pubkit (in any of its *-ci.yml
#    workflows), pubrel's release workflow and pubrel-version, pub-version,
#    each tool ci.tools pins by tag, and the crates nightly.pins.crates names
#    in Cargo.lock;
# 2. the other crates' updates that cargo vet covers with an audit (no new
#    exemption) and cargo deny passes; the body lists each one skipped,
#    with what `cargo vet suggest` says it needs;
# 3. the npm packages, to the newest version each range in package.json
#    allows, in package-lock.json only;
# 4. tests/requirements.lock, re-resolved from requirements.txt.
#
# A repository's pubkit.json turns each language's updates off with, for
# example, `"update": { "node": false }`, or all of them with `"update":
# false`; the pins always come. Its CI checks advisories on every run
# either way.
#
# An open pull request is updated, never a second one opened. If its CI
# fails with the updates, the pins are tested alone, and the updates
# dropped when that passes. Nothing merges it: the Sustenaut bot DMs on
# Slack when it is green or fails.
#
# It pushes and opens pull requests as a GitHub App: the secrets app-id and
# app-key (its private key), or on pubkit's own schedule the variable
# NIGHTLY_APP_ID and the secret NIGHTLY_APP_KEY, give, for each governed repository, a token for that repository
# alone, with only contents, pull-requests and workflows write (and
# actions read, to wait for its CI), that expires within the hour. The app is installed on every owner whose
# repositories governed.json lists. Without NIGHTLY_APP_ID it falls back,
# with a warning, to PUBKIT_BUMP_TOKEN, a token that may push branches and
# open pull requests there; with neither, the job only reports.
# The secrets notify-token (a Slack bot's, chat:write) and notify-user, whom it
# DMs; on pubkit's own schedule, SUSTENAUT_SLACK_BOT_TOKEN and SLACK_DM_USER_ID.
name: nightly

on:
  schedule: [{ cron: '41 1 * * *' }]
  workflow_dispatch:
  workflow_call:
    inputs:
      repos:
        type: string
        required: true
        description: 'The repos file itself, as JSON: {"repositories": [{"repo", "govern"}]}'
      pubkit:
        type: string
        default: Sustenaut/pubkit
        description: The pubkit whose latest release runs this
    secrets:
      app-id:
        required: false
        description: The GitHub App that pushes and opens the pull requests
      app-key:
        required: false
        description: Its private key
      notify-token:
        required: false
        description: A Slack bot token, chat:write, that says how each pull request went
      notify-user:
        required: false
        description: Whom it DMs

env:
  # Called, the input; on its own schedule, this repository.
  PUBKIT: '${{ inputs.pubkit || github.repository }}'

jobs:
  report:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.report.outputs.repos }}
      tag: ${{ steps.wheel.outputs.tag }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.14' }
      # The latest release, from its wheel: what governed repositories move to.
      - id: wheel
        run: |
          tag=$(gh release view --repo "$PUBKIT" --json tagName --jq .tagName)
          python -m pip install --quiet \
            "https://github.com/$PUBKIT/releases/download/$tag/pubkit-${tag#v}-py3-none-any.whl"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env: { GH_TOKEN: '${{ github.token }}' }
      - if: inputs.repos == ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { path: pubkit, persist-credentials: false }
      - id: report
        run: |
          if [ -n "$REPOS" ]; then
            governed=$(jq -c '[.repositories[] | select(.govern) | .repo]' <<< "$REPOS")
          else
            echo "::warning::governed.json and this schedule go in a later release: call this workflow with the repos input."
            governed=$(jq -c '[.repositories[].repo]' pubkit/governed.json)
          fi
          mkdir repos
          for repo in $(jq -r '.[]' <<< "$governed"); do
            git clone --quiet --depth 1 "https://github.com/$repo" "repos/${repo#*/}"
          done
          if [ "$governed" != '[]' ]; then pubkit freshness repos/*; fi
          echo "repos=$governed" >> "$GITHUB_OUTPUT"
        env: { REPOS: '${{ inputs.repos }}' }

  update:
    needs: report
    if: needs.report.outputs.repos != '[]'
    runs-on: ubuntu-latest
    # Waits for the pull request's CI, fuzzing included.
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.report.outputs.repos) }}
    env:
      REPO: '${{ matrix.repo }}'
      APP_ID: '${{ secrets.app-id || vars.NIGHTLY_APP_ID }}'
    steps:
      # The app's token covers this repository alone: its owner and name.
      - id: where
        run: |
          echo "owner=${REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${REPO#*/}" >> "$GITHUB_OUTPUT"
      - if: env.APP_ID != ''
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: '${{ env.APP_ID }}'
          private-key: '${{ secrets.app-key || secrets.NIGHTLY_APP_KEY }}'
          owner: '${{ steps.where.outputs.owner }}'
          repositories: '${{ steps.where.outputs.name }}'
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-actions: read
      - id: token
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "::add-mask::$APP_TOKEN"
            echo "token=$APP_TOKEN" >> "$GITHUB_OUTPUT"
          elif [ -n "$BUMP_TOKEN" ]; then
            echo "::warning::No app-id or NIGHTLY_APP_ID: falling back to PUBKIT_BUMP_TOKEN for $REPO. Set up the Sustenaut nightly app (README, The nightly)."
            echo "token=$BUMP_TOKEN" >> "$GITHUB_OUTPUT"
          else
            echo "No app-id, NIGHTLY_APP_ID or PUBKIT_BUMP_TOKEN: reporting only, no pull request for $REPO." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "present=$([ -n "$APP_TOKEN$BUMP_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          APP_TOKEN: '${{ steps.app.outputs.token }}'
          BUMP_TOKEN: '${{ secrets.PUBKIT_BUMP_TOKEN }}'
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { repository: '${{ env.PUBKIT }}', ref: '${{ needs.report.outputs.tag }}', path: pubkit }
      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.14' }
      - if: steps.token.outputs.present == 'true'
        id: latest
        run: |
          latest() { gh release view --repo "$1" --json tagName --jq .tagName; }
          tag=$(latest "$PUBKIT")
          python -m pip install --quiet \
            "https://github.com/$PUBKIT/releases/download/$tag/pubkit-${tag#v}-py3-none-any.whl"
          pubrel=$(latest Sustenaut/pubrel); pub=$(latest Sustenaut/publet)
          echo "pubrel=${pubrel#v}" >> "$GITHUB_OUTPUT"
          echo "pub=${pub#v}" >> "$GITHUB_OUTPUT"
        env: { GH_TOKEN: '${{ github.token }}' }
      - if: steps.token.outputs.present == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-vet
            ~/.cargo/bin/pubrel
          key: nightly-tools-0.20.2-0.10.2-${{ steps.latest.outputs.pubrel }}-${{ runner.os }}
      - if: steps.token.outputs.present == 'true'
        run: |
          command -v cargo-deny >/dev/null || cargo install --locked cargo-deny --version 0.20.2
          command -v cargo-vet >/dev/null || cargo install --locked cargo-vet --version 0.10.2
          command -v pubrel >/dev/null || cargo install --locked pubrel --version "$PUBREL"
        env: { PUBREL: '${{ steps.latest.outputs.pubrel }}' }
      - if: steps.token.outputs.present == 'true'
        run: |
          git clone --quiet "https://x-access-token:$GH_TOKEN@github.com/$REPO" repo
          cd repo
          ../pubkit/.github/nightly/update.sh
        env:
          GH_TOKEN: '${{ steps.token.outputs.token }}'
          PUBREL: '${{ steps.latest.outputs.pubrel }}'
          PUB: '${{ steps.latest.outputs.pub }}'
          SLACK_TOKEN: '${{ secrets.notify-token || secrets.SUSTENAUT_SLACK_BOT_TOKEN }}'
          SLACK_USER: '${{ secrets.notify-user || secrets.SLACK_DM_USER_ID }}'
