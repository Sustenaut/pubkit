# Python: the hash-locked requirements against the Python advisories, by
# pip-audit, which reads the files without installing them. Any finding
# fails.
#
# One job of the CI `pubkit sync` writes from the ci block of pubkit.json
# (src/pubkit/ci.py), so a repository runs only the jobs it asks for and
# none shows as skipped.
name: job-python-audit

on:
  workflow_call:
    inputs:
      python-version: { type: string, default: '3.14' }
      audit-requirements: { type: string, default: tests/requirements.lock, description: "The hash-locked requirements files the audit job checks, space-separated." }

jobs:
  # Every locked requirement against the Python advisories, by pip-audit,
  # which reads the files without installing them.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '${{ inputs.python-version }}' }
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: ${{ inputs.audit-requirements }}
          require-hashes: true
