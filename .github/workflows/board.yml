# Reusable: grade every repository the caller's lists name, A to E, with
# `pubkit board`, and keep board.json and index.html as the run's "board"
# artifact for 90 days, which is the board's history. It deploys nothing
# and writes nowhere: the caller's workflow publishes the page.
#
# The caller checks nothing out first: this workflow checks out the
# caller's repository, where the lists are, installs the pubkit its
# tests/requirements.lock pins (by hash, wheels only), and reads every repository
# they name with `token`, a fine-grained token that can only read
# (Metadata, Contents, Actions, Issues, Pull requests, Dependabot alerts,
# Code scanning alerts, Secret scanning alerts and Administration, all
# read). `sonar-token` reads private SonarQube Cloud projects; public ones
# need none.
name: board

on:
  workflow_call:
    inputs:
      lock:
        type: string
        default: tests/requirements.lock
        description: The hash-locked requirements, pubkit's wheel among them, in the caller's repository
      protected:
        type: string
        default: protected.json
        description: The repositories and the checks each requires, in the caller's repository
      governed:
        type: string
        default: governed.json
        description: The repositories a nightly updates; none when the file is absent
      rules:
        type: string
        default: ''
        description: Other rules than the ones pubkit ships, in the caller's repository
    secrets:
      token:
        required: true
        description: A read-only fine-grained token covering every listed repository
      sonar-token:
        required: false
        description: Reads private SonarQube Cloud projects

permissions:
  contents: read

jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.14' }
      - run: python -m pip install --quiet --only-binary ':all:' --require-hashes -r "$LOCK"
        env: { LOCK: '${{ inputs.lock }}' }
      - shell: bash  # pipefail: a failed board fails the step, though tee succeeds
        run: |
          args=(--out site --config "$PROTECTED")
          if [ -f "$GOVERNED" ]; then args+=(--governed "$GOVERNED"); fi
          if [ -n "$RULES" ]; then args+=(--rules "$RULES"); fi
          pubkit board "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: '${{ secrets.token }}'
          SONAR_TOKEN: '${{ secrets.sonar-token }}'
          PROTECTED: '${{ inputs.protected }}'
          GOVERNED: '${{ inputs.governed }}'
          RULES: '${{ inputs.rules }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: board
          path: |
            site/board.json
            site/index.html
          retention-days: 90
