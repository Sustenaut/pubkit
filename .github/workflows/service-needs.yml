# A service's needs from GitHub Actions: ask the convergence engine to check one deploy
# unit's needs (read-only), or to fulfil them once a person approves the plan on the
# engine's page, and end as the request ends (src/pubrules/service_needs.py,
# `pubrules service-needs`). Each need shows on a line of its own: a log group, an
# annotation when it is not ready, and a row of the summary's table.
#
# `pubrules sync` writes the caller, .github/workflows/service-needs.yml, in a
# repository with a deploy block: run by hand, with check or fulfil and the unit. The run's
# identity is its OIDC token for the engine's address, so the caller grants
# `id-token: write` and passes no secret. The engine only takes a run on the
# default branch of a repository of an owner it lists.
name: service-needs

on:
  workflow_call:
    inputs:
      unit: { type: string, required: true, description: "The deploy unit whose needs the engine checks or fulfils." }
      kind: { type: string, default: check, description: "check: each need's state, read-only, asking no one; fulfil: the engine runs the unit's walk --fulfil once a person approves its plan; gate: the run only waits for an approval." }
      plan: { type: string, default: '', description: "A gate's plan, which the approver reads." }
      timeout-minutes: { type: number, default: 300, description: "How long the run waits; past it the run ends, and the engine still acts once approved." }
      engine: { type: string, default: 'https://convergence.sustenaut.eu', description: "The convergence engine's address, which is also the OIDC token's audience." }
      runs-on: { type: string, default: ubuntu-latest, description: "The runner label the job runs on, from pubrules.json's ci.runs-on." }
      python-version: { type: string, default: '3.14' }

permissions:
  contents: read

jobs:
  service-needs:
    runs-on: ${{ inputs.runs-on }}
    # The run's own limit is timeout-minutes (at most 340); the job's leaves room for the setup.
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '${{ inputs.python-version }}' }
      - name: pubrules, as the repository locks it
        run: |
          python3 -m venv .pubrules
          # Tried three times, then from the wheel mirror: a release download can time out.
          tests/install-lock .pubrules/bin/pip
      - name: ask the engine
        id: ask
        run: >-
          .pubrules/bin/pubrules service-needs --stage ask --unit "$UNIT" --kind "$KIND" --plan "$PLAN"
          --minutes "$MINUTES" --engine "$ENGINE"
        env:
          UNIT: ${{ inputs.unit }}
          KIND: ${{ inputs.kind }}
          PLAN: ${{ inputs.plan }}
          MINUTES: ${{ inputs.timeout-minutes }}
          ENGINE: ${{ inputs.engine }}
      # The ask step's summary (the approval box, when a person must approve a fulfil) shows
      # on the run's page from here on, while this step waits for the end.
      - name: the needs of ${{ inputs.unit }}
        run: >-
          .pubrules/bin/pubrules service-needs --stage wait --request "$REQUEST" --unit "$UNIT" --kind "$KIND"
          --minutes "$MINUTES" --engine "$ENGINE"
        env:
          REQUEST: ${{ steps.ask.outputs.request }}
          UNIT: ${{ inputs.unit }}
          KIND: ${{ inputs.kind }}
          # What the ask step left of timeout-minutes: the two steps share one limit.
          MINUTES: ${{ steps.ask.outputs.minutes }}
          ENGINE: ${{ inputs.engine }}
