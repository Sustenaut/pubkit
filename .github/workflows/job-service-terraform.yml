# A service's Terraform, checked without a backend (fmt, init, validate),
# so no state or credentials are touched.
#
# One job of the CI `pubkit sync` writes from the ci block of pubkit.json
# (src/pubkit/ci.py), so a repository runs only the jobs it asks for and
# none shows as skipped.
name: job-service-terraform

on:
  workflow_call:
    inputs:
      terraform-dir: { type: string, required: true, description: Where the Terraform files are. }

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with: { terraform_wrapper: false }
      - run: terraform -chdir="$DIR" fmt -check -recursive
        env: { DIR: '${{ inputs.terraform-dir }}' }
      - name: terraform init, tried three times, then from the provider mirror
        run: |
          init() { terraform -chdir="$DIR" init -backend=false -input=false; }
          for attempt in 1 2 3; do
            init && exit 0
            echo "::warning::terraform init failed (attempt $attempt of 3)"
            [ "$attempt" = 3 ] || sleep "${INIT_PAUSE:-15}"
          done
          # Then from pubkit.json's provider mirror (mirror.terraform), if it
          # names one: the lock's hashes still check every archive.
          mirror="$(jq -r '.mirror.terraform // empty' pubkit.json 2>/dev/null || true)"
          [ -n "$mirror" ] || exit 1
          echo "::warning::terraform init: trying the providers from $mirror"
          printf 'provider_installation {\n  network_mirror { url = "%s/" }\n}\n' "$mirror" > "$RUNNER_TEMP/provider-mirror.tfrc"
          TF_CLI_CONFIG_FILE="$RUNNER_TEMP/provider-mirror.tfrc" init
        env: { DIR: '${{ inputs.terraform-dir }}' }
      - run: terraform -chdir="$DIR" validate
        env: { DIR: '${{ inputs.terraform-dir }}' }
