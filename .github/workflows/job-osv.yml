# Every lockfile the repository commits against the OSV database.
#
# One job of the CI `pubkit sync` writes from the ci block of pubkit.json
# (src/pubkit/ci.py), so a repository runs only the jobs it asks for and
# none shows as skipped.
name: job-osv

on:
  workflow_call:

jobs:
  # Every lockfile the repository commits (Cargo.lock, package-lock.json,
  # the hash-locked pip requirements) against the OSV database, which
  # gathers the RustSec, GitHub, PyPI and npm advisories, on every run. It
  # has no switch. The lockfiles are named rather than found by a recursive
  # scan, which would read a requirements.txt's lower bounds as pins.
  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: locks
        run: |
          {
            echo 'args<<EOF'
            git ls-files '*Cargo.lock' '*package-lock.json' \
              | sed 's/^/--lockfile=/'
            git ls-files '*requirements.lock' | sed 's/^/--lockfile=requirements.txt:/'
            echo EOF
          } >> "$GITHUB_OUTPUT"
          git ls-files '*Cargo.lock' '*package-lock.json' '*requirements.lock' | grep -q . \
            && echo "found=true" >> "$GITHUB_OUTPUT" \
            || echo "::notice::No lockfile is committed, so OSV-Scanner has nothing to scan."
      - if: steps.locks.outputs.found == 'true'
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: ${{ steps.locks.outputs.args }}
