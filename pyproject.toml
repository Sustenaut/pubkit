[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pubrules"
version = "0.42.0"
description = "The setup every package shares: managed files, reusable CI, the Rust crate standard and the Gherkin rule."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "David Schryer", email = "schryer@gmail.com" }]
# PyYAML reads the workflows sync and conform check.
dependencies = ["PyYAML>=6"]

[project.urls]
Repository = "https://github.com/Sustenaut/pubrules"

[project.scripts]
pubrules = "pubrules.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Globs skip dot-directories, so each one templates use is named.
pubrules = [
    "standard.json",
    "ruleset.json",
    "tag-ruleset.json",
    "board/rules.json",
    # The commit of the release's tag, which the release CI writes before
    # it builds the wheel; a source tree has none (refs.py).
    "release-commit",
    "templates/**/*",
    "templates/**/.github/workflows/*",
]

# `make functional` measures the suite, the `pubrules` processes it starts
# included, into coverage/coverage.xml for SonarQube Cloud.
[tool.coverage.run]
source = ["pubrules"]
patch = ["subprocess", "execv"]
parallel = true

[tool.coverage.xml]
output = "coverage/coverage.xml"
