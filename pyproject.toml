[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pubkit"
version = "0.16.0"
description = "The testing setup every package shares: a pytest-bdd plugin, managed files, and reusable CI."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "David Schryer", email = "schryer@gmail.com" }]
dependencies = ["pytest>=8", "pytest-bdd>=8"]

[project.urls]
Repository = "https://github.com/schryer/pubkit"

[project.entry-points.pytest11]
pubkit = "pubkit.plugin"

[project.scripts]
pubkit = "pubkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Globs skip dot-directories, so each one templates use is named.
pubkit = [
    "standard.json",
    "ruleset.json",
    "tag-ruleset.json",
    "board/rules.json",
    # The commit of the release's tag, which the release CI writes before
    # it builds the wheel; a source tree has none (refs.py).
    "release-commit",
    "templates/**/*",
    "templates/**/.github/workflows/*",
]

# `make functional` measures the suite, the `pubkit` processes it starts
# included, into coverage/coverage.xml for SonarQube Cloud.
[tool.coverage.run]
source = ["pubkit"]
patch = ["subprocess"]
parallel = true

[tool.coverage.xml]
output = "coverage/coverage.xml"
