name: ci

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  # pubkit's shared Node CI: the locked dependencies without their install
  # scripts, npm test, pubkit sync --check and, with a SONAR_TOKEN secret,
  # SonarQube Cloud. Add browser tests with `browser-test`.
  ci:
    uses: schryer/pubkit/.github/workflows/node-ci.yml@v{version}
    secrets: inherit

  # The shared release workflow: on a pull request, a code change records
  # what it changes and a release is the bump its changes require,
  # published; on main, a published version is tagged and released.
  release:
    needs: ci
    uses: schryer/pubrel/.github/workflows/release.yml@v{pubrel}
    with: { pubrel-version: v{pubrel} }
    permissions:
      contents: write
