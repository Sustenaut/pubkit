apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  selector: { matchLabels: { app: example } }
  template:
    metadata: { labels: { app: example } }
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: app
          image: ghcr.io/example/example-app
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
spec:
  selector: { matchLabels: { app: proxy } }
  template:
    metadata: { labels: { app: proxy } }
    spec:
      containers:
        - name: proxy
          image: example/proxy
