# A service as k8s/components/app expects one: the app, a proxy in front of it
# that the component leaves alone, and a patch of its own that wins over the
# component's (this app keeps its API token).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: example
resources:
  - app.yaml
components:
  - ../../../k8s/components/app
patches:
  - target: { kind: Deployment, name: app }
    patch: |
      - { op: replace, path: /spec/template/spec/automountServiceAccountToken, value: true }
